name: Apply START-04-08 Final
on:
  push:
    branches: [develop]
    paths:
      - '.himate-bootstrap/**'
      - '.github/workflows/apply-start-04-08.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply final START-04-08 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .himate-bootstrap/part-* > /tmp/himate-final.b64
          base64 --decode /tmp/himate-final.b64 > /tmp/himate-final.tar.gz

          rm -rf backend
          rm -f Dockerfile HIMATE_START_01-03.zip
          rm -rf frontend/lib/src
          rm -f docs/START-01-03_ACCEPTANCE.md docs/TEST_REPORT.md
          rm -f .github/workflows/bootstrap-start-04-08.yml

          tar -xzf /tmp/himate-final.tar.gz -C .

          rm -rf .himate-bootstrap
          rm -f .github/workflows/apply-start-04-08.yml

          git config user.name "himatecorp2025"
          git config user.email "himatecorp2025@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize HIMATE START-04-08"
          git push origin HEAD:develop
