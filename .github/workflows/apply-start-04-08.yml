name: Apply START-04-08 Final
on:
  push:
    branches: [develop]
    paths:
      - '.himate-bootstrap/**'
      - '.github/workflows/apply-start-04-08.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Reconstruct package
        shell: bash
        run: |
          set -eu
          cat .himate-bootstrap/part-* > /tmp/final.b64
          base64 -d /tmp/final.b64 > /tmp/final.tar.gz
          set +e
          gzip -dc /tmp/final.tar.gz > /tmp/final.tar
          gzip_rc=$?
          set -e
          echo "gzip exit: $gzip_rc"
          tar -tf /tmp/final.tar > /tmp/package-list.txt
          test -s /tmp/package-list.txt
          grep -q '^services/cmd/gateway/main.go$' /tmp/package-list.txt
          grep -q '^frontend/lib/main.dart$' /tmp/package-list.txt
          grep -q '^render.yaml$' /tmp/package-list.txt
      - name: Extract package
        shell: bash
        run: |
          set -eu
          rm -rf backend frontend/lib/src
          rm -f Dockerfile HIMATE_START_01-03.zip
          rm -f docs/START-01-03_ACCEPTANCE.md docs/TEST_REPORT.md
          tar -xf /tmp/final.tar -C .
          test -f services/cmd/gateway/main.go
          test -f frontend/lib/main.dart
          test -f render.yaml
      - name: Commit final tree
        shell: bash
        run: |
          set -eu
          rm -rf .himate-bootstrap
          rm -f .github/workflows/apply-start-04-08.yml
          git config user.name "himatecorp2025"
          git config user.email "himatecorp2025@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize HIMATE START-04-08"
          git push origin HEAD:develop
