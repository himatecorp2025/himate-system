name: HIMATE Fast CI

on:
  push:
    branches: ['start-*', 'pre-start-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose topology
        run: docker compose config --quiet
      - name: Validate smoke database schema contracts
        run: python3 scripts/audit_smoke_schema_contracts.py
      - name: Validate smoke shell execution contracts
        run: python3 scripts/audit_smoke_execution_contracts.py
      - name: Validate global START-23.1 frontend mutation contract
        run: python3 scripts/audit_start_23_1_contract.py
      - name: Validate inherited START-23.11.1 commercial contract
        run: python3 scripts/audit_start_23_11_1.py
      - name: Validate current START-23.11.3i contract
        run: python3 scripts/audit_start_23_11_3i.py
      - name: Validate current START-23.11.3j contract
        run: python3 scripts/audit_start_23_11_3j.py
      - name: Validate current START-23.11.3k contract
        run: python3 scripts/audit_start_23_11_3k.py
      - name: Validate current START-23.11.4 contract
        run: python3 scripts/audit_start_23_11_4.py
      - name: Validate current START-23.11.5 contract
        run: python3 scripts/audit_start_23_11_5.py
      - name: Validate current START-23.11.6 contract
        run: python3 scripts/audit_start_23_11_6.py
      - name: Validate current START-23.11.7 closure contract
        run: python3 scripts/audit_start_23_11_7.py
      - name: Validate START-23.12 Phase 1 production acceptance contract
        run: python3 scripts/audit_start_23_12_phase1.py
      - name: Validate START-23.12 Phase 2 production acceptance contract
        run: python3 scripts/audit_start_23_12_phase2.py
      - name: Validate START-23.12 Phase 3 architecture acceptance contract
        run: python3 scripts/audit_start_23_12_phase3.py
      - name: Validate START-23.12 Phase 3B tenant invoicing contract
        run: python3 scripts/audit_start_23_12_phase3b.py
      - name: Validate START-23.12 Phase 4 security contract
        run: python3 scripts/audit_start_23_12_phase4.py
      - name: Validate START-23.12 Phase 5 final acceptance contract
        run: python3 scripts/audit_start_23_12_phase5.py
      - name: Validate START-23.12 Phase 1-5 cross-phase closure contract
        run: python3 scripts/audit_start_23_12_closure.py
      - name: Validate START-24.1 authentication/session/MFA contract
        run: python3 scripts/audit_start_24_1.py
      - name: Validate START-24.2 RBAC and tenant-isolation contract
        run: python3 scripts/audit_start_24_2.py
      - name: Validate START-24.3 API/input/web security contract
        run: python3 scripts/audit_start_24_3.py
      - name: Validate START-24.4 abuse and resource-bound contract
        run: python3 scripts/audit_start_24_4.py

  go-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...

  flutter-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --platform chrome --reporter expanded
      - name: Run current partner onboarding audits
        run: |
          python3 ../scripts/audit_start_23_11_3g.py
          python3 ../scripts/audit_start_23_11_3h.py
          python3 ../scripts/audit_start_23_11_3i.py
          python3 ../scripts/audit_start_23_11_3j.py
          python3 ../scripts/audit_start_23_11_3k.py
          python3 ../scripts/audit_start_23_11_4.py
          python3 ../scripts/audit_start_23_11_5.py
          python3 ../scripts/audit_start_23_11_6.py
          python3 ../scripts/audit_start_23_11_7.py

  compose-current:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start current microservice topology
        run: docker compose up -d --build
      - name: Verify gateway and synchronized service health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run current regression checkpoint — START-17 SSR
        run: sh scripts/smoke_start_17.sh http://127.0.0.1:8080
      - name: Run inherited commercial checkpoint — START-23.11.1
        run: sh scripts/smoke_start_23_11_1.sh http://127.0.0.1:8080
      - name: Run current regression checkpoint — START-23.11.3g
        run: sh scripts/smoke_start_23_11_3g.sh http://127.0.0.1:8080
      - name: Run current checkpoint — START-23.11.3h
        run: sh scripts/smoke_start_23_11_3h.sh http://127.0.0.1:8080
      - name: Run current checkpoint — START-23.11.3i
        run: sh scripts/smoke_start_23_11_3i.sh http://127.0.0.1:8080
      - name: Run current checkpoint — START-23.11.3j
        run: sh scripts/smoke_start_23_11_3j.sh http://127.0.0.1:8080
      - name: Run current checkpoint — START-23.11.3k
        run: sh scripts/smoke_start_23_11_3k.sh http://127.0.0.1:8080
      - name: Run current checkpoint — START-23.11.4
        run: sh scripts/smoke_start_23_11_4.sh http://127.0.0.1:8080
      - name: Run current checkpoint — START-23.11.5
        run: sh scripts/smoke_start_23_11_5.sh http://127.0.0.1:8080
      - name: Run current checkpoint — START-23.11.6
        run: sh scripts/smoke_start_23_11_6.sh http://127.0.0.1:8080
      - name: Run current closure checkpoint — START-23.11.7
        run: sh scripts/smoke_start_23_11_7.sh http://127.0.0.1:8080
      - name: Run START-23.12 Phase 3B tenant invoicing checkpoint
        run: sh scripts/smoke_start_23_12_phase3b.sh http://127.0.0.1:18083 http://127.0.0.1:18082
      - name: Run START-23.12 Phase 4 security checkpoint
        run: sh scripts/smoke_start_23_12_phase4.sh http://127.0.0.1:8080
      - name: Run START-23.12 Phase 5 compliance/PWA/100-tenant checkpoint
        run: sh scripts/smoke_start_23_12_phase5.sh http://127.0.0.1:8080
      - name: Stop test topology
        if: always()
        run: docker compose down -v
