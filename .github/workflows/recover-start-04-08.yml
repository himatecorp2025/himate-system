name: Recover START-04-08 Final
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/recover-start-04-08.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Recover package contents
        shell: bash
        run: |
          set -eu
          cat .himate-bootstrap/part-* > /tmp/final.b64
          base64 -d /tmp/final.b64 > /tmp/final.tar.gz
          gzip -dc /tmp/final.tar.gz > /tmp/final.tar || true
          mkdir -p /tmp/recovered
          tar -xf /tmp/final.tar -C /tmp/recovered || true
          test -f /tmp/recovered/services/cmd/gateway/main.go
          test -f /tmp/recovered/services/cmd/partners/main.go
          test -f /tmp/recovered/services/cmd/catalog/main.go
          test -f /tmp/recovered/services/cmd/billing/main.go
          test -f /tmp/recovered/frontend/lib/main.dart
          test -f /tmp/recovered/render.yaml
          test -f /tmp/recovered/.github/workflows/ci.yml
      - name: Apply recovered final tree
        shell: bash
        run: |
          set -eu
          rm -rf backend frontend/lib/src
          rm -f Dockerfile HIMATE_START_01-03.zip
          rm -f docs/START-01-03_ACCEPTANCE.md docs/TEST_REPORT.md
          cp -a /tmp/recovered/. .
          rm -rf .himate-bootstrap
          rm -f .github/workflows/apply-start-04-08.yml .github/workflows/recover-start-04-08.yml
          git config user.name "himatecorp2025"
          git config user.email "himatecorp2025@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize HIMATE START-04-08"
          git push origin HEAD:develop
