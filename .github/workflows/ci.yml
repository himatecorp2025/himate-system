name: HIMATE CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/gateway ./cmd/partners ./cmd/catalog ./cmd/billing ./cmd/contact

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
      - name: Verify public frontend bundle
        run: |
          test -s build/web/landing.html
          test -s build/web/himate-brand-r4.css
          test -s build/web/site.js
          test -s build/web/art/statue_hero_r5.png
          test -s build/web/art/program_piano_r5.png
          test -s build/web/art/gallery_hall_r5.png
          test -s build/web/art/login_desktop_r5.png
          test -s build/web/art/login_mobile_r5.png
          grep -q "statue_hero_r5.png" build/web/himate-brand-r4.css
          grep -q "/api/v1/public/contact" build/web/contact.html
          grep -q 'href="/himate-brand-r4.css"' build/web/landing.html
          grep -q 'src="/site.js"' build/web/landing.html
          if grep -q 'href="/brand.css"' build/web/landing.html; then exit 1; fi


  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose topology
        run: docker compose config --quiet
