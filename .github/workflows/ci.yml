name: HIMATE CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Verify OpenAPI contract
        run: |
          test -s ../docs/openapi.yaml
          grep -q '^openapi: 3.1.0' ../docs/openapi.yaml
      - run: go build ./cmd/...

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --platform chrome
      - run: flutter build web --release
      - name: Verify public frontend bundle
        run: |
          test -s build/web/landing.html
          test -s build/web/himate-brand-r4.css
          test -s build/web/site.js
          test -s build/web/art/statue_hero_r5.png
          test -s build/web/art/program_piano_r5.png
          test -s build/web/art/gallery_hall_r5.png
          test -s build/web/art/login_desktop_r5.png
          test -s build/web/art/login_mobile_r5.png
          grep -q "statue_hero_r5.png" build/web/himate-brand-r4.css
          grep -q "/api/v1/public/contact" build/web/contact.html
          grep -q 'href="/himate-brand-r4.css"' build/web/landing.html
          grep -q 'src="/site.js"' build/web/landing.html
          grep -q 'src="data:image/webp;base64,' build/web/landing.html
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          canonical = Path("web/art/himate_logo_master_v2.webp").read_bytes()
          pages = [
              "landing.html",
              "platform.html",
              "modules.html",
              "programs.html",
              "impact.html",
              "partners.html",
              "contact.html",
          ]
          embedded = None
          for page in pages:
              html = (Path("build/web") / page).read_text()
              match = re.search(r'src="data:image/webp;base64,([^"]+)"', html)
              if match is None:
                  raise SystemExit(f"{page}: embedded HIMATE logo is missing")
              payload = base64.b64decode(match.group(1), validate=True)
              if payload != canonical:
                  raise SystemExit(f"{page}: embedded HIMATE logo differs from canonical asset")
              if embedded is None:
                  embedded = match.group(1)
              elif embedded != match.group(1):
                  raise SystemExit(f"{page}: embedded HIMATE logo differs from the other public pages")
              if "/brand/himate-logo-" in html:
                  raise SystemExit(f"{page}: dynamic logo route reference is forbidden")
              if 'src="/art/himate_logo_master_' in html:
                  raise SystemExit(f"{page}: external logo asset dependency is forbidden")

          brand_source = Path("lib/brand_assets.dart").read_text()
          brand_match = re.search(r"const String himateLogoBase64 = '([^']+)'", brand_source)
          if brand_match is None:
              raise SystemExit("Flutter embedded HIMATE logo source is missing")
          if base64.b64decode(brand_match.group(1), validate=True) != canonical:
              raise SystemExit("Flutter embedded HIMATE logo differs from canonical asset")
          if brand_match.group(1) != embedded:
              raise SystemExit("Flutter and public-site HIMATE logos are not byte-identical")

          main_source = Path("lib/main.dart").read_text()
          if "Image.memory(" not in main_source or "himateLogoBytes" not in main_source:
              raise SystemExit("Flutter logo is not rendered from embedded bytes")
          PY
          if grep -q 'href="/brand.css"' build/web/landing.html; then exit 1; fi


  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate controlled deployment triggers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("vercel.json").read_text())
          enabled = config.get("git", {}).get("deploymentEnabled", {})
          if enabled.get("*") is not False:
              raise SystemExit("Vercel Git auto-deploy must remain disabled by default")
          if any(value is True for value in enabled.values()):
              raise SystemExit("Vercel development branches must not auto-deploy")
          PY
          grep -q 'autoDeploy: false' render.yaml

      - name: Validate Render Blueprint bindings
        run: |
          grep -q 'healthCheckPath: /api/v1/live' render.yaml
          for key in PARTNERS_HOSTPORT CATALOG_HOSTPORT BILLING_HOSTPORT CONTACT_HOSTPORT PROVISIONING_HOSTPORT ENVIRONMENTS_HOSTPORT CONNECTOR_HOSTPORT HEALTH_HOSTPORT IMPACT_HOSTPORT EVIDENCE_HOSTPORT REPORTS_HOSTPORT CMS_HOSTPORT STORAGE_HOSTPORT PARTNER_RUNTIME_HOSTPORT; do
            grep -q "key: $key" render.yaml || { echo "Missing Render binding: $key"; exit 1; }
          done
          for service in himate-partners himate-catalog himate-billing himate-contact himate-provisioning himate-environments himate-connector himate-health himate-impact himate-evidence himate-reports himate-cms himate-storage himate-runtime; do
            grep -q "name: $service" render.yaml || { echo "Missing Render service: $service"; exit 1; }
          done
      - name: Validate Docker Compose topology
        run: docker compose config --quiet
      - name: Build and start containerized microservices
        run: docker compose up -d --build
      - name: Verify gateway and private-service health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run START-01-08 backend smoke
        run: sh scripts/smoke_backend.sh http://127.0.0.1:8080
      - name: Run START-09-13 integration smoke
        run: sh scripts/smoke_start_09_13.sh http://127.0.0.1:8080
      - name: Run START-14-15 integration smoke
        run: sh scripts/smoke_start_14_15.sh http://127.0.0.1:8080
      - name: Run START-16 CMS integration smoke
        run: sh scripts/smoke_start_16.sh http://127.0.0.1:8080
      - name: Run START-18-19 governance, branding and RBAC smoke V2
        run: sh scripts/smoke_start_18_19_v2.sh http://127.0.0.1:8080
      - name: Run START-20 Domains and Deployments smoke
        run: sh scripts/smoke_start_20.sh http://127.0.0.1:8080
      - name: Stop test topology
        if: always()
        run: docker compose down -v
