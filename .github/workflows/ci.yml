name: HIMATE CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Verify OpenAPI contract
        run: |
          test -s ../docs/openapi.yaml
          grep -q '^openapi: 3.1.0' ../docs/openapi.yaml
      - run: go build ./cmd/gateway ./cmd/partners ./cmd/catalog ./cmd/billing ./cmd/contact

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --platform chrome
      - run: flutter build web --release
      - name: Verify public frontend bundle
        run: |
          test -s build/web/landing.html
          test -s build/web/himate-brand-r4.css
          test -s build/web/site.js
          test -s build/web/art/statue_hero_r5.png
          test -s build/web/art/program_piano_r5.png
          test -s build/web/art/gallery_hall_r5.png
          test -s build/web/art/login_desktop_r5.png
          test -s build/web/art/login_mobile_r5.png
          grep -q "statue_hero_r5.png" build/web/himate-brand-r4.css
          grep -q "/api/v1/public/contact" build/web/contact.html
          grep -q 'href="/himate-brand-r4.css"' build/web/landing.html
          grep -q 'src="/site.js"' build/web/landing.html
          if grep -q 'href="/brand.css"' build/web/landing.html; then exit 1; fi


  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose topology
        run: docker compose config --quiet
      - name: Build and start containerized microservices
        run: docker compose up -d --build
      - name: Verify gateway and private-service health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run START-01-08 backend smoke
        run: sh scripts/smoke_backend.sh http://127.0.0.1:8080
      - name: Stop test topology
        if: always()
        run: docker compose down -v
