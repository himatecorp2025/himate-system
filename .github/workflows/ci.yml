name: HIMATE CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/gateway ./cmd/partners ./cmd/catalog ./cmd/billing

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
      - name: Verify public frontend bundle
        run: |
          test -s build/web/landing.html
          test -s build/web/himate-brand-r4.css
          test -s build/web/art/hero_statue.jpg
          test -s build/web/art/program_piano.jpg
          test -s build/web/art/partners_hall.jpg
          grep -q 'href="/himate-brand-r4.css"' build/web/landing.html
          if grep -q 'href="/brand.css"' build/web/landing.html; then exit 1; fi
