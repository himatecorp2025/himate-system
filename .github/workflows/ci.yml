name: HIMATE CI
on:
  push:
    branches: [develop, main, 'start-*', 'pre-start-*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Verify OpenAPI contract
        run: |
          test -s ../docs/openapi.yaml
          grep -q '^openapi: 3.1.0' ../docs/openapi.yaml
          grep -q 'version: 0.8.17-start-23.11.3' ../docs/openapi.yaml
          grep -q '^  /api/v1/backups:' ../docs/openapi.yaml
          grep -q '^  /api/v1/backups/restore-points/{restorePointId}/restore-test:' ../docs/openapi.yaml
          grep -q '^  /connector/v1/data/batches:' ../docs/openapi.yaml
          grep -q '^  /connector/v1/reconcile:' ../docs/openapi.yaml
          grep -q '^  /api/v1/connectors/start22/retention:' ../docs/openapi.yaml
          grep -q '^  /api/v1/admin/roles/{roleKey}:' ../docs/openapi.yaml
          grep -q '^  /api/v1/modules/{moduleKey}/relationships:' ../docs/openapi.yaml
          grep -q '^  /api/v1/modules/{moduleKey}/impact-metrics:' ../docs/openapi.yaml
          grep -q '^  /api/v1/notifications:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/auth/login:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/dashboard:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/modules/{moduleKey}/activate:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/modules/{moduleKey}/subscription:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/users:' ../docs/openapi.yaml
          grep -q '^  /api/v1/partners/{partnerId}/portal-users:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/partners/{partnerId}/agreement:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/partners/{partnerId}/commercial-status:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/partners/{partnerId}/events:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/partners/{partnerId}/license/collect:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/plans:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/plans/{planKey}:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/partners/{partnerId}/plan:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/partners/{partnerId}/plan/modules:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/plans:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/plan:' ../docs/openapi.yaml
          grep -q '^  /partner/api/v1/plan/modules:' ../docs/openapi.yaml
          grep -q '^  /api/v1/payments/partners/{partnerId}/profile:' ../docs/openapi.yaml
          grep -q '^  /api/v1/payments/partners/{partnerId}/attempts:' ../docs/openapi.yaml
          grep -q '^  /webhooks/stripe:' ../docs/openapi.yaml
          grep -q '^  /api/v1/connectors/{partnerId}/website-adapter:' ../docs/openapi.yaml
          grep -q '^  /connector/v1/commercial-state:' ../docs/openapi.yaml
          grep -q 'HMAC-SHA-512' ../docs/openapi.yaml
          test -s ../docs/START-21_ACCEPTANCE.md
          test -s ../docs/START-22_ACCEPTANCE.md
          test -s ../docs/START-22.1_ACCEPTANCE.md
          test -s ../docs/START-22.2_ACCEPTANCE.md
          test -s ../docs/START-22.3_ACCEPTANCE.md
          test -s ../docs/START-23_ACCEPTANCE.md
          test -s ../docs/START-23.1_ACCEPTANCE.md
          test -s ../docs/START-23.2_ACCEPTANCE.md
          test -s ../docs/START-23.3_ACCEPTANCE.md
          test -s ../docs/START-23.4_ACCEPTANCE.md
          test -s ../docs/START-23.5_ACCEPTANCE.md
          test -s ../docs/START-23.6_ACCEPTANCE.md
          test -s ../docs/START-23.7_ACCEPTANCE.md
          test -s ../docs/START-23.8_ACCEPTANCE.md
          test -s ../docs/START-23.1-23.6_CROSS_PHASE_AUDIT.md
          grep -q '^  /api/v1/auth/password-reset/request:' ../docs/openapi.yaml
          grep -q '^  /api/v1/auth/password-reset/confirm:' ../docs/openapi.yaml
          grep -q '^  /api/v1/partner-categories:' ../docs/openapi.yaml
          grep -q '^  /api/v1/module-groups:' ../docs/openapi.yaml
          grep -q '^  /api/v1/impact/definitions:' ../docs/openapi.yaml
          grep -q '^  /api/v1/payments/partners/{partnerId}/profile:' ../docs/openapi.yaml
          grep -q '^  /api/v1/payments/partners/{partnerId}/attempts:' ../docs/openapi.yaml
          grep -q '^  /api/v1/billing/partners/{partnerId}/license/collect:' ../docs/openapi.yaml
          grep -q '^  /webhooks/stripe:' ../docs/openapi.yaml
          test -s ../docs/START-23.1_FUNCTIONAL_MATRIX.json
          test -s ../docs/START-23.9_ACCEPTANCE.md
          test -s ../docs/START-23.10_ACCEPTANCE.md
          test -s ../docs/START-23.11.1_ACCEPTANCE.md
          test -s ../docs/START-23.11.2_ACCEPTANCE.md
          test -s ../docs/START-23.11.3_ACCEPTANCE.md
          grep -q '^  /api/v1/billing/partners/{partnerId}/terms-history:' ../docs/openapi.yaml
          grep -q '^  /api/v1/backups/scheduler/run:' ../docs/openapi.yaml
          grep -q '^  /api/v1/dashboard/summary:' ../docs/openapi.yaml
          grep -q '^  /api/v1/search:' ../docs/openapi.yaml
          test -s ../docs/START-23.1_SURFACE_INVENTORY.md
          test -s ../docs/adr/0004-encrypted-offsite-backup-and-restore-verification.md
          test -s ../docs/adr/0005-klavierhaus-one-way-data-connector.md
      - run: go build ./cmd/...

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --platform chrome
      - name: Run START-23 responsive and bilingual frontend audit
        run: python3 ../scripts/audit_start_23_frontend.py
      - name: Run START-23.1 functional-contract audit
        run: python3 ../scripts/audit_start_23_1_contract.py
      - name: Run START-23.2 commercial control-plane audit
        run: python3 ../scripts/audit_start_23_2.py
      - name: Run START-23.3 authoritative cancellation audit
        run: python3 ../scripts/audit_start_23_3.py
      - name: Run START-23.4 provider-backed payment audit
        run: python3 ../scripts/audit_start_23_4.py
      - name: Run START-23.5 dynamic bilingual business-model audit
        run: python3 ../scripts/audit_start_23_5.py
      - name: Run START-23.6 Administration, Identity & Business CRUD audit
        run: python3 ../scripts/audit_start_23_6.py
      - name: Run START-23.1-23.6 cross-phase closure audit
        run: python3 ../scripts/audit_start_23_1_23_6.py
      - name: Run START-23.7 Evidence, Impact & Reporting audit
        run: python3 ../scripts/audit_start_23_7.py
      - name: Run START-23.8 CMS, Design & SEO Completion audit
        run: python3 ../scripts/audit_start_23_8.py
      - name: Run START-23.9 Dashboard, Analytics & Global Search audit
        run: python3 ../scripts/audit_start_23_9.py
      - name: Run START-23.10 System & Operations Production Closure audit
        run: python3 ../scripts/audit_start_23_10.py
      - name: Run START-23.11.1 Module Registry & Individual Commercial Model audit
        run: python3 ../scripts/audit_start_23_11_1.py
      - name: Run START-23.11.2 Subscription Plans & Recurring Billing audit
        run: python3 ../scripts/audit_start_23_11_2.py
      - name: Run START-23.11.3 Module Marketplace audit
        run: python3 ../scripts/audit_start_23_11_3.py
      - run: flutter build web --release
      - name: Verify public frontend bundle
        run: |
          test -s build/web/landing.html
          test -s build/web/himate-brand-r4.css
          test -s build/web/site.js
          test -s build/web/art/statue_hero_r5.png
          test -s build/web/art/program_piano_r5.png
          test -s build/web/art/gallery_hall_r5.png
          test -s build/web/art/login_desktop_r5.png
          test -s build/web/art/login_mobile_r5.png
          test -s build/web/index.html
          test -s build/web/brand/himate_identity_wordmark_2026.webp
          test -s build/web/brand/himate_identity_icon_192.webp
          test -s build/web/brand/himate_identity_favicon_32.png
          grep -q "statue_hero_r5.png" build/web/himate-brand-r4.css
          grep -q "/api/v1/public/contact" build/web/contact.html
          grep -q 'href="/himate-brand-r4.css"' build/web/landing.html
          grep -q 'src="/site.js"' build/web/landing.html
          python3 - <<'PY'
          from pathlib import Path
          index = Path("build/web/index.html").read_text()
          assert r"\n" not in index, "Flutter bootstrap HTML contains a literal \\n text artifact"
          assert "background: #071B33;" in index, "Flutter bootstrap HTML must prevent a white pre-frame flash"
          PY
          for page in landing platform modules programs impact partners contact; do
            file="build/web/$page.html"
            grep -q 'src="/brand/himate_identity_wordmark_2026.webp"' "$file"
            grep -q 'href="/brand/himate_identity_favicon_32.png"' "$file"
            grep -q 'href="/manifest.json"' "$file"
            if grep -q 'data:image/webp;base64' "$file"; then echo "$file still embeds a legacy logo"; exit 1; fi
            if grep -q 'himate_logo_master' "$file"; then echo "$file still references a legacy logo filename"; exit 1; fi
            if grep -q '/brand/himate-logo-' "$file"; then echo "$file still references a legacy dynamic logo route"; exit 1; fi
          done
          grep -q "const String himateWordmarkUrl = '/brand/himate_identity_wordmark_2026.webp';" lib/brand_assets.dart
          grep -q "const String himateIconUrl = '/brand/himate_identity_icon_192.webp';" lib/brand_assets.dart
          grep -q 'Image.network(' lib/main.dart
          test -s lib/start22_connector.dart
          test -s lib/module_control_plane.dart
          test -s lib/notifications_panel.dart
          test -s lib/partner_portal.dart
          test -s lib/commercial_automation_ui.dart
          test -s test/start23_responsive_qa_test.dart
          grep -q 'start223CommercialWorkflowPanel' lib/commercial_automation_ui.dart
          grep -q 'start223WebsiteAdapterPanel' lib/commercial_automation_ui.dart
          grep -q 'Commercial agreement reference' lib/main.dart
          grep -q 'class PartnerPortalApp' lib/partner_portal.dart
          grep -q 'class PartnerPortalShell' lib/partner_portal.dart
          grep -q '/partner/api/v1/modules' lib/partner_portal.dart
          grep -q '/partner/login' lib/main.dart
          grep -q 'class ResponsiveKpiGrid' lib/main.dart
          grep -q 'ModuleControlPlanePage' lib/main.dart
          grep -q 'NotificationCenterButton' lib/main.dart
          if grep -q 'notifications_none_rounded, onTap: () {}' lib/main.dart; then
            echo "Notification bell is still a no-op"
            exit 1
          fi
          grep -q 'Start22ConnectorPanel' lib/start22_connector.dart
          grep -q 'connectors/start22/summary' lib/start22_connector.dart
          grep -q 'HIMATE 7 years' lib/start22_connector.dart
          if grep -q 'himateLogoBase64\|himateLogoBytes\|Image.memory(' lib/main.dart lib/brand_assets.dart; then
            echo "Flutter still contains embedded legacy logo bytes"
            exit 1
          fi
          if grep -q 'himate_logo_master' pubspec.yaml ../services/cmd/gateway/main.go ../scripts/smoke_start_18_19_v2.sh; then
            echo "Legacy logo filename still referenced by executable source"
            exit 1
          fi
          if grep -q 'himate-logo-v3' ../services/cmd/gateway/main.go; then
            echo "Legacy dynamic logo route still exists"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("build/web/manifest.json").read_text())
          icons = manifest.get("icons", [])
          assert any(
              icon.get("src") == "/brand/himate_identity_icon_192.webp"
              and icon.get("sizes") == "192x192"
              for icon in icons
          ), manifest
          PY

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate controlled deployment triggers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("vercel.json").read_text())
          enabled = config.get("git", {}).get("deploymentEnabled", {})
          if enabled.get("*") is not False:
              raise SystemExit("Vercel Git auto-deploy must remain disabled by default")
          if any(value is True for value in enabled.values()):
              raise SystemExit("Vercel development branches must not auto-deploy")
          PY
          grep -q 'autoDeploy: false' render.yaml

      - name: Validate Render Blueprint bindings
        run: |
          python3 scripts/audit_render_bindings.py
          grep -q 'healthCheckPath: /api/v1/live' render.yaml
          for key in PARTNERS_HOSTPORT CATALOG_HOSTPORT BILLING_HOSTPORT PAYMENTS_HOSTPORT CONTACT_HOSTPORT PROVISIONING_HOSTPORT ENVIRONMENTS_HOSTPORT CONNECTOR_HOSTPORT HEALTH_HOSTPORT IMPACT_HOSTPORT EVIDENCE_HOSTPORT REPORTS_HOSTPORT CMS_HOSTPORT STORAGE_HOSTPORT BACKUPS_HOSTPORT PARTNER_RUNTIME_HOSTPORT NOTIFICATIONS_HOSTPORT; do
            grep -q "key: $key" render.yaml || { echo "Missing Render binding: $key"; exit 1; }
          done
          for service in himate-partners himate-catalog himate-billing himate-payments himate-contact himate-provisioning himate-environments himate-connector himate-health himate-impact himate-evidence himate-reports himate-cms himate-storage himate-backups himate-runtime himate-notifications; do
            grep -q "name: $service" render.yaml || { echo "Missing Render service: $service"; exit 1; }
          done
          grep -q 'key: HIMATE_RUNTIME_PROVIDER' render.yaml
          grep -q 'value: render' render.yaml
          grep -q 'key: RENDER_API_KEY' render.yaml
          grep -q 'key: RENDER_API_BASE' render.yaml
          grep -q 'https://api.render.com/v1' render.yaml
          grep -q 'key: HIMATE_RENDER_SERVICE_ID' render.yaml
          grep -q 'HIMATE_RUNTIME_PROVIDER: local' docker-compose.yml
          grep -q 'key: HIMATE_BACKUP_PROVIDER' render.yaml
          grep -q 'value: render_disk' render.yaml
          grep -q 'key: HIMATE_BACKUP_ENCRYPTION_KEY_B64' render.yaml
          grep -q 'key: HIMATE_BACKUP_OFFSITE_ROOT' render.yaml
          grep -q 'name: himate-backups-offsite' render.yaml
          grep -q 'mountPath: /offsite' render.yaml
          grep -q 'sizeGB: 10' render.yaml
          if grep -q 'key: HIMATE_BACKUP_S3_' render.yaml; then
            echo "Render production backup must not require external S3 credentials"
            exit 1
          fi
          grep -q 'HIMATE_BACKUP_PROVIDER: local' docker-compose.yml
          grep -q 'name: himate-payments' render.yaml
          grep -q 'key: PAYMENT_PROVIDER' render.yaml
          grep -q 'value: stripe' render.yaml
          grep -q 'key: STRIPE_SECRET_KEY' render.yaml
          grep -q 'key: STRIPE_WEBHOOK_SECRET' render.yaml
          if grep -q 'sk_live_' render.yaml docker-compose.yml; then
            echo "Stripe secret must never be committed"
            exit 1
          fi
          python3 scripts/audit_start_23_4.py
      - name: Validate Docker Compose topology
        run: docker compose config --quiet
      - name: Build and start containerized microservices
        run: docker compose up -d --build
      - name: Verify gateway and private-service health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run START-01-08 backend smoke
        run: |
          # START-01–08 predates the explicit START-22.3 agreement/invoice gate.
          # Preserve the historical smoke itself and add only its modern commercial prerequisites.
          docker compose exec -T postgres psql -U himate -d himate -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO billing.commercial_agreements(partner_id,status,agreement_reference,note,agreed_at,agreed_by)
          VALUES
            ('ptr_000002','AGREED','ci://historical/start01-08-contract','START-22.3 historical fixture',NOW(),'ci-fixture'),
            ('ptr_000003','AGREED','ci://historical/start09-contract','START-22.3 historical fixture',NOW(),'ci-fixture'),
            ('ptr_000004','AGREED','ci://historical/start09-isolation-contract','START-22.3 historical fixture',NOW(),'ci-fixture')
          ON CONFLICT(partner_id) DO UPDATE SET status='AGREED',agreement_reference=EXCLUDED.agreement_reference,agreed_at=EXCLUDED.agreed_at,agreed_by=EXCLUDED.agreed_by;
          INSERT INTO billing.documents(partner_id,kind,name,storage_url,note,uploaded_by)
          VALUES
            ('ptr_000002','INVOICE','Historical activation invoice','ci://historical/start01-08-invoice','START-22.3 historical fixture','ci-fixture'),
            ('ptr_000003','INVOICE','Historical START-09 activation invoice','ci://historical/start09-invoice','START-22.3 historical fixture','ci-fixture'),
            ('ptr_000004','INVOICE','Historical START-09 isolation activation invoice','ci://historical/start09-isolation-invoice','START-22.3 historical fixture','ci-fixture');
          SQL
          sh scripts/smoke_backend.sh http://127.0.0.1:8080
      - name: Run START-09-13 integration smoke
        run: sh scripts/smoke_start_09_13.sh http://127.0.0.1:8080
      - name: Run START-14-15 integration smoke
        run: sh scripts/smoke_start_14_15.sh http://127.0.0.1:8080
      - name: Run START-16 CMS integration smoke
        run: sh scripts/smoke_start_16.sh http://127.0.0.1:8080
      - name: Run START-17 public SSR and SEO smoke
        run: sh scripts/smoke_start_17.sh http://127.0.0.1:8080
      - name: Run START-18-19 governance, branding and RBAC smoke V2
        run: sh scripts/smoke_start_18_19_v2.sh http://127.0.0.1:8080
      - name: Run START-20 Domains and Deployments smoke
        run: sh scripts/smoke_start_20.sh http://127.0.0.1:8080
      - name: Run profile, owner and locale smoke
        run: sh scripts/smoke_profile_identity.sh http://127.0.0.1:8080
      - name: Run pre-START-22 business completion smoke
        run: sh scripts/smoke_business_completion.sh http://127.0.0.1:8080
      - name: Run START-21 encrypted backups and verified recovery smoke
        run: sh scripts/smoke_start_21.sh http://127.0.0.1:8080
      - name: Run START-22 signed Klavierhaus Connector and retention smoke
        run: sh scripts/smoke_start_22.sh http://127.0.0.1:8080
      - name: Run START-22.1 Control Plane Completion smoke
        run: sh scripts/smoke_start_22_1.sh http://127.0.0.1:8080
      - name: Run START-22.2 Partner Portal tenant-isolation smoke
        run: sh scripts/smoke_start_22_2.sh http://127.0.0.1:8080
      - name: Run START-22.3 Commercial Automation & Website Integration smoke
        run: sh scripts/smoke_start_22_3.sh http://127.0.0.1:8080
      - name: Run post-START-22.3 privacy and credential-boundary audit
        run: sh scripts/audit_privacy_start_01_22_3.sh http://127.0.0.1:8080
      - name: Run post-START-22.3 concurrent load audit
        run: sh scripts/audit_load_start_01_22_3.sh http://127.0.0.1:8080
      - name: Run START-23 responsive and functional route-matrix smoke
        run: sh scripts/smoke_start_23.sh http://127.0.0.1:8080
      - name: Run START-23.1 mutation acceptance canary
        run: sh scripts/smoke_start_23_1_mutation_canary.sh http://127.0.0.1:8080
      - name: Run START-23.2 Partner × Module commercial smoke
        run: sh scripts/smoke_start_23_2.sh http://127.0.0.1:8080
      - name: Run START-23.3 authoritative cancellation state-machine smoke
        run: sh scripts/smoke_start_23_3.sh http://127.0.0.1:8080
      - name: Run START-23.4 provider-backed activation and autopay smoke
        run: sh scripts/smoke_start_23_4.sh http://127.0.0.1:8080
      - name: Run START-23.5 dynamic bilingual business-model smoke
        run: sh scripts/smoke_start_23_5.sh http://127.0.0.1:8080
      - name: Run START-23.6 Administration, Identity & Business CRUD smoke
        run: sh scripts/smoke_start_23_6.sh http://127.0.0.1:8080
      - name: Run START-23.7 Evidence, Impact & Reporting smoke
        run: sh scripts/smoke_start_23_7.sh http://127.0.0.1:8080
      - name: Run START-23.8 CMS, Design & SEO Completion smoke
        run: sh scripts/smoke_start_23_8.sh http://127.0.0.1:8080
      - name: Run START-23.9 Dashboard, Analytics & Global Search smoke
        run: sh scripts/smoke_start_23_9.sh http://127.0.0.1:8080
      - name: Run START-23.10 System & Operations Production Closure smoke
        run: sh scripts/smoke_start_23_10.sh http://127.0.0.1:8080
      - name: Run START-23.11.1 Module Registry & Individual Commercial Model smoke
        run: sh scripts/smoke_start_23_11_1.sh http://127.0.0.1:8080
      - name: Run START-23.11.2 Subscription Plans & Recurring Billing smoke
        run: sh scripts/smoke_start_23_11_2.sh http://127.0.0.1:8080
      - name: Run START-23.11.3 Module Marketplace smoke
        run: sh scripts/smoke_start_23_11_3.sh http://127.0.0.1:8080
      - name: Stop test topology
        if: always()
        run: docker compose down -v
