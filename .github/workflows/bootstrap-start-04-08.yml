name: Apply START-04-08
on:
  push:
    branches: [develop]
    paths:
      - '.himate-bootstrap/**'
      - '.github/workflows/bootstrap-start-04-08.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply prepared START-04-08 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .himate-bootstrap/part-* > /tmp/himate-start-04-08.b64
          base64 --decode /tmp/himate-start-04-08.b64 > /tmp/himate-start-04-08.tar.gz

          rm -rf backend
          rm -f Dockerfile HIMATE_START_01-03.zip
          rm -rf frontend/lib/src/api frontend/lib/src/models frontend/lib/src/screens
          rm -rf frontend/lib/src/services frontend/lib/src/theme frontend/lib/src/widgets

          tar -xzf /tmp/himate-start-04-08.tar.gz -C .
          rm -rf .himate-bootstrap
          rm -f .github/workflows/bootstrap-start-04-08.yml

          git config user.name "himatecorp2025"
          git config user.email "himatecorp2025@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement HIMATE START-04-08 microservice control plane"
          git push origin HEAD:develop
