services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: himate
      POSTGRES_USER: himate
      POSTGRES_PASSWORD: himate-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himate"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog:
    build:
      context: .
      dockerfile: services/docker/catalog.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
    depends_on:
      postgres:
        condition: service_healthy

  partners:
    build:
      context: .
      dockerfile: services/docker/partners.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      BILLING_HOSTPORT: billing:10000
    depends_on:
      postgres:
        condition: service_healthy

  billing:
    build:
      context: .
      dockerfile: services/docker/billing.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      CATALOG_HOSTPORT: catalog:10000
      PARTNERS_HOSTPORT: partners:10000
      PAYMENTS_HOSTPORT: payments:10000
      EVIDENCE_HOSTPORT: evidence:10000
      NOTIFICATIONS_HOSTPORT: notifications:10000
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      partners:
        condition: service_started
      payments:
        condition: service_started
      evidence:
        condition: service_started

  payments:
    build:
      context: .
      dockerfile: services/docker/payments.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      BILLING_HOSTPORT: billing:10000
      PAYMENT_PROVIDER: mock
      STRIPE_WEBHOOK_SECRET: whsec_local_start234_test
    depends_on:
      postgres:
        condition: service_healthy

  contact:
    build:
      context: .
      dockerfile: services/docker/contact.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_CONTACT_NOTIFY_TO: ${HIMATE_CONTACT_NOTIFY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    build:
      context: .
      dockerfile: services/docker/storage.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_STORAGE_ROOT: /data/partners
    volumes:
      - himate_partner_storage:/data/partners
    depends_on:
      postgres:
        condition: service_healthy

  runtime:
    build:
      context: .
      dockerfile: services/docker/runtime.Dockerfile
    ports:
      - "127.0.0.1:18081:10000"
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_RUNTIME_PROVIDER: local
    depends_on:
      postgres:
        condition: service_healthy

  backups:
    build:
      context: .
      dockerfile: services/docker/backups.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      PARTNER_DATABASE_ADMIN_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_BACKUP_ENCRYPTION_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      HIMATE_BACKUP_PROVIDER: local
      HIMATE_BACKUP_OFFSITE_ROOT: /offsite
      HIMATE_BACKUP_WORKERS: "1"
      STORAGE_HOSTPORT: storage:10000
      ENVIRONMENTS_HOSTPORT: environments:10000
      CONNECTOR_HOSTPORT: connector:10000
      PARTNERS_HOSTPORT: partners:10000
    volumes:
      - himate_backup_offsite:/offsite
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
      environments:
        condition: service_started
      connector:
        condition: service_started
      partners:
        condition: service_started

  evidence:
    build:
      context: .
      dockerfile: services/docker/evidence.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      STORAGE_HOSTPORT: storage:10000
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started

  impact:
    build:
      context: .
      dockerfile: services/docker/impact.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      EVIDENCE_HOSTPORT: evidence:10000
    depends_on:
      postgres:
        condition: service_healthy
      evidence:
        condition: service_started

  reports:
    build:
      context: .
      dockerfile: services/docker/reports.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      IMPACT_HOSTPORT: impact:10000
      EVIDENCE_HOSTPORT: evidence:10000
      PARTNERS_HOSTPORT: partners:10000
      STORAGE_HOSTPORT: storage:10000
    depends_on:
      postgres:
        condition: service_healthy
      impact:
        condition: service_started
      evidence:
        condition: service_started
      partners:
        condition: service_started
      storage:
        condition: service_started

  cms:
    build:
      context: .
      dockerfile: services/docker/cms.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      STORAGE_HOSTPORT: storage:10000
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started

  environments:
    build:
      context: .
      dockerfile: services/docker/environments.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      PARTNER_RUNTIME_HOSTPORT: runtime:10000
      PARTNERS_HOSTPORT: partners:10000
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started
      notifications:
        condition: service_started
      partners:
        condition: service_started

  connector:
    build:
      context: .
      dockerfile: services/docker/connector.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_CONNECTOR_DATA_MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      HIMATE_CONNECTOR_DATA_KEY_VERSION: v1
      IMPACT_HOSTPORT: impact:10000
      CATALOG_HOSTPORT: catalog:10000
      BILLING_HOSTPORT: billing:10000
      PARTNERS_HOSTPORT: partners:10000
      CMS_HOSTPORT: cms:10000
    depends_on:
      postgres:
        condition: service_healthy
      impact:
        condition: service_started
      catalog:
        condition: service_started
      billing:
        condition: service_started
      partners:
        condition: service_started
      cms:
        condition: service_started

  provisioning:
    build:
      context: .
      dockerfile: services/docker/provisioning.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      PARTNER_DATABASE_ADMIN_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      PARTNER_DATABASE_MASTER_SECRET: local-partner-database-master-secret-12345678901234567890
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      PARTNERS_HOSTPORT: partners:10000
      BILLING_HOSTPORT: billing:10000
      CATALOG_HOSTPORT: catalog:10000
      ENVIRONMENTS_HOSTPORT: environments:10000
      CONNECTOR_HOSTPORT: connector:10000
      STORAGE_HOSTPORT: storage:10000
    depends_on:
      postgres:
        condition: service_healthy
      partners:
        condition: service_started
      billing:
        condition: service_started
      catalog:
        condition: service_started
      environments:
        condition: service_started
      connector:
        condition: service_started
      storage:
        condition: service_started

  automation:
    build:
      context: .
      dockerfile: services/docker/automation.Dockerfile
    ports:
      - "127.0.0.1:18082:10000"
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_AUTOMATION_SERVICE_KEYS_JSON: '{"ci-producer":"ci-producer-automation-secret-123456789","ci-consumer":"ci-consumer-automation-secret-123456789","workshop":"workshop-automation-secret-local-123456789","finance":"finance-automation-secret-local-123456789","scheduler":"scheduler-automation-secret-local-123456789","client-piano":"client-piano-automation-secret-local-123456789","notifications":"notifications-automation-secret-local-123456789"}'
      HIMATE_AUTOMATION_FINANCE_SECRET: finance-automation-secret-local-123456789
    depends_on:
      postgres:
        condition: service_healthy

  tenantfinance:
    build:
      context: .
      dockerfile: services/docker/tenantfinance.Dockerfile
    ports:
      - "127.0.0.1:18083:10000"
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      PARTNERS_HOSTPORT: partners:10000
      AUTOMATION_HOSTPORT: automation:10000
      TENANT_FINANCE_HOSTPORT: tenantfinance:10000
      HIMATE_TENANT_FINANCE_DEFAULT_TERMS_DAYS: "8"
      HIMATE_TENANT_FINANCE_DEFAULT_ACCOUNTING_BASIS: CASH
      HIMATE_TENANT_FINANCE_DEFAULT_PAYMENT_METHODS: ""
      HIMATE_TENANT_FINANCE_DEFAULT_CURRENCY: USD
      HIMATE_TENANT_FINANCE_DEFAULT_INVOICE_PREFIX: INV
      HIMATE_AUTOMATION_FINANCE_SECRET: finance-automation-secret-local-123456789
    depends_on:
      postgres:
        condition: service_healthy
      partners:
        condition: service_started
      automation:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: services/docker/notifications.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
    depends_on:
      postgres:
        condition: service_healthy

  health:
    build:
      context: .
      dockerfile: services/docker/health.Dockerfile
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      PARTNERS_HOSTPORT: partners:10000
      CATALOG_HOSTPORT: catalog:10000
      BILLING_HOSTPORT: billing:10000
      PAYMENTS_HOSTPORT: payments:10000
      CONTACT_HOSTPORT: contact:10000
      PROVISIONING_HOSTPORT: provisioning:10000
      ENVIRONMENTS_HOSTPORT: environments:10000
      CONNECTOR_HOSTPORT: connector:10000
      IMPACT_HOSTPORT: impact:10000
      EVIDENCE_HOSTPORT: evidence:10000
      REPORTS_HOSTPORT: reports:10000
      CMS_HOSTPORT: cms:10000
      STORAGE_HOSTPORT: storage:10000
      BACKUPS_HOSTPORT: backups:10000
      PARTNER_RUNTIME_HOSTPORT: runtime:10000
      NOTIFICATIONS_HOSTPORT: notifications:10000
      AUTOMATION_HOSTPORT: automation:10000
    depends_on:
      postgres:
        condition: service_healthy
      partners:
        condition: service_started
      catalog:
        condition: service_started
      billing:
        condition: service_started
      payments:
        condition: service_started
      contact:
        condition: service_started
      provisioning:
        condition: service_started
      environments:
        condition: service_started
      connector:
        condition: service_started
      impact:
        condition: service_started
      evidence:
        condition: service_started
      reports:
        condition: service_started
      cms:
        condition: service_started
      storage:
        condition: service_started
      backups:
        condition: service_started
      runtime:
        condition: service_started
      notifications:
        condition: service_started
      automation:
        condition: service_started
      tenantfinance:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/docker/gateway.Dockerfile
    ports:
      - "8080:10000"
    environment:
      HIMATE_APP_VERSION: ${HIMATE_APP_VERSION:-0.8.32-start-23.11.7}
      HIMATE_ENV: development
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_SESSION_SECRET: local-development-session-secret-change-me-123456
      HIMATE_BOOTSTRAP_ADMIN_NAME: HIMATE Administrator
      HIMATE_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      HIMATE_BOOTSTRAP_ADMIN_PASSWORD: Local-Development1!Password
      HIMATE_SESSION_TTL_HOURS: 8
      HIMATE_PASSWORD_RESET_TTL_MINUTES: 30
      HIMATE_PASSWORD_RESET_BASE_URL: http://127.0.0.1:8080
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      COOKIE_SECURE: "false"
      PARTNERS_HOSTPORT: partners:10000
      CATALOG_HOSTPORT: catalog:10000
      BILLING_HOSTPORT: billing:10000
      PAYMENTS_HOSTPORT: payments:10000
      CONTACT_HOSTPORT: contact:10000
      PROVISIONING_HOSTPORT: provisioning:10000
      ENVIRONMENTS_HOSTPORT: environments:10000
      CONNECTOR_HOSTPORT: connector:10000
      HEALTH_HOSTPORT: health:10000
      IMPACT_HOSTPORT: impact:10000
      EVIDENCE_HOSTPORT: evidence:10000
      REPORTS_HOSTPORT: reports:10000
      CMS_HOSTPORT: cms:10000
      STORAGE_HOSTPORT: storage:10000
      BACKUPS_HOSTPORT: backups:10000
      PARTNER_RUNTIME_HOSTPORT: runtime:10000
      NOTIFICATIONS_HOSTPORT: notifications:10000
      TENANT_FINANCE_HOSTPORT: tenantfinance:10000
    depends_on:
      postgres:
        condition: service_healthy
      partners:
        condition: service_started
      catalog:
        condition: service_started
      billing:
        condition: service_started
      payments:
        condition: service_started
      contact:
        condition: service_started
      provisioning:
        condition: service_started
      environments:
        condition: service_started
      connector:
        condition: service_started
      health:
        condition: service_started
      impact:
        condition: service_started
      evidence:
        condition: service_started
      reports:
        condition: service_started
      cms:
        condition: service_started
      storage:
        condition: service_started
      backups:
        condition: service_started
      runtime:
        condition: service_started
      notifications:
        condition: service_started
      tenantfinance:
        condition: service_started

volumes:
  himate_partner_storage:
  himate_backup_offsite:
