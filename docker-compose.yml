services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: himate
      POSTGRES_USER: himate
      POSTGRES_PASSWORD: himate-local
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himate"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog:
    build:
      context: ./services
      dockerfile: docker/catalog.Dockerfile
    environment:
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
    depends_on:
      postgres: {condition: service_healthy}

  partners:
    build:
      context: ./services
      dockerfile: docker/partners.Dockerfile
    environment:
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
    depends_on:
      postgres: {condition: service_healthy}

  billing:
    build:
      context: ./services
      dockerfile: docker/billing.Dockerfile
    environment:
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      CATALOG_HOSTPORT: catalog:10000
    depends_on:
      postgres: {condition: service_healthy}
      catalog: {condition: service_started}

  gateway:
    build:
      context: .
      dockerfile: services/docker/gateway.Dockerfile
    ports: ["8080:10000"]
    environment:
      HIMATE_ENV: development
      HIMATE_APP_VERSION: 0.2.0-start-04-08
      DATABASE_URL: postgres://himate:himate-local@postgres:5432/himate?sslmode=disable
      HIMATE_INTERNAL_TOKEN: local-development-internal-token-123456789
      HIMATE_SESSION_SECRET: local-development-session-secret-change-me-123456
      HIMATE_BOOTSTRAP_ADMIN_NAME: HIMATE Administrator
      HIMATE_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      HIMATE_BOOTSTRAP_ADMIN_PASSWORD: local-development-password
      HIMATE_SESSION_TTL_HOURS: 8
      COOKIE_SECURE: "false"
      PARTNERS_HOSTPORT: partners:10000
      CATALOG_HOSTPORT: catalog:10000
      BILLING_HOSTPORT: billing:10000
    depends_on:
      postgres: {condition: service_healthy}
      partners: {condition: service_started}
      catalog: {condition: service_started}
      billing: {condition: service_started}
