name: himate_frontend
description: HIMATE System control plane.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.2.1
  web: ^1.1.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/himate_login_heritage.jpg
    - assets/us_states_map.svg
    - assets/sidebar_mountains.svg
