<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">HIMATE heritage and innovation</title>
<desc id="desc">A premium deep navy cultural architecture composition with classical columns, a sculptural silhouette, steel blue arcs and royal gold light.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#061426"/>
    <stop offset=".55" stop-color="#0B1F3B"/>
    <stop offset="1" stop-color="#173F61"/>
  </linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4E5966" stop-opacity=".22"/>
    <stop offset=".45" stop-color="#E7D8B8" stop-opacity=".80"/>
    <stop offset=".72" stop-color="#B9A989" stop-opacity=".55"/>
    <stop offset="1" stop-color="#4B5662" stop-opacity=".18"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2D799"/>
    <stop offset=".55" stop-color="#D4AF6B"/>
    <stop offset="1" stop-color="#9C6B23"/>
  </linearGradient>
  <radialGradient id="glow" cx=".72" cy=".56" r=".34">
    <stop offset="0" stop-color="#F0D8A2" stop-opacity=".42"/>
    <stop offset=".45" stop-color="#D4AF6B" stop-opacity=".10"/>
    <stop offset="1" stop-color="#D4AF6B" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".24"/></filter>
</defs>

<rect width="1200" height="900" fill="url(#bg)"/>
<rect width="1200" height="900" fill="url(#glow)"/>

