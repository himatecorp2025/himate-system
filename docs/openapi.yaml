openapi: 3.1.0
info:
  title: HIMATE Control Plane API
  version: 0.8.28-start-23.11.3k
  description: >
    Authenticated REST contract for the START-01 through START-23.11.3k HIMATE
    control-plane surface. Dynamic business labels/descriptions are persisted in
    English and Hungarian; locale resolution uses locale query, X-Himate-Locale,
    Accept-Language, then en_US. Partner business databases remain isolated behind
    connector/API contracts; deployment remains isolated behind Runtime;
    encrypted backup/recovery remains isolated behind Backups; payment-provider
    access is isolated behind the Payments adapter while Billing remains the
    financial source of truth.
servers:
  - url: /
tags:
  - name: Health
  - name: Authentication
  - name: Profile
  - name: Administration
  - name: Audit
  - name: Notifications
  - name: Partner Portal
  - name: Partners
  - name: Modules
  - name: Billing
  - name: Payments
  - name: Contact
  - name: Provisioning
  - name: Environments
  - name: Connector
  - name: System Health
  - name: Backups
  - name: Impact
  - name: Public
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Gateway and microservice health
      responses:
        "200":
          description: Health snapshot with checked_at timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  version: {type: string}
                  architecture: {type: string}
                  checked_at: {type: string, format: date-time}
                  release_consistent:
                    type: boolean
                    description: True only when every configured gateway-visible application microservice reports the same release version as the gateway.
                  services:
                    type: object
                    description: Per-service health state; release drift is reported as version_unknown or version_mismatch.
                    additionalProperties: {type: string}
                  service_versions:
                    type: object
                    description: Release version reported by each gateway-visible application microservice.
                    additionalProperties: {type: string}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Administrator sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        "200": {description: Authenticated administrator}
        "401": {description: Invalid credentials}
        "429": {description: Sign-in rate limit exceeded}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End administrator session
      responses:
        "204": {description: Session ended}
  /api/v1/auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Request a one-time administrator password reset link
      description: Always returns a generic acceptance message for valid email syntax so account existence is not disclosed. Production delivery requires runtime SMTP and reset-base-URL configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "202": {description: Reset request accepted without account enumeration}
        "400": {description: Invalid email syntax}
        "429": {description: Password-reset request rate limit exceeded}
        "503": {description: Production reset delivery is unavailable}
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Consume a one-time reset token and replace the administrator password
      description: Tokens are stored only as SHA-256 hashes, expire automatically, are one-time-use, and password reset rotates the session version so all previously issued sessions become invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: {type: string, minLength: 20}
                new_password: {type: string, format: password, minLength: 12}
      responses:
        "200": {description: Password reset completed and prior sessions invalidated}
        "400": {description: Invalid or expired token or password-policy violation}
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Current administrator
      responses:
        "200": {description: Current administrator}
        "401": {description: Authentication required}
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Current user's profile and effective access
      responses:
        "200": {description: Current profile}
        "401": {description: Authentication required}
    patch:
      tags: [Profile]
      summary: Update current user's personal profile and locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 2, maxLength: 120}
                email: {type: string, format: email}
                preferred_locale: {type: string, enum: [en_US, hu_HU]}
                timezone: {type: string}
                job_title: {type: string, maxLength: 120}
                phone: {type: string, maxLength: 50}
      responses:
        "200": {description: Updated profile}
        "400": {description: Validation error}
        "401": {description: Authentication required}
        "409": {description: Email already belongs to another administrator}
  /api/v1/profile/password:
    post:
      tags: [Profile]
      summary: Change current user's password and rotate session version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password, minLength: 12}
      responses:
        "200": {description: Password changed and current session refreshed}
        "400": {description: Password validation error}
        "403": {description: Current password is incorrect}
  /api/v1/admin/roles:
    get:
      tags: [Administration]
      summary: List built-in and locale-resolved bilingual custom HIMATE role definitions and permissions
      responses:
        "200": {description: Role catalog}
    post:
      tags: [Administration]
      summary: Create a bilingual custom backend-authoritative role
      description: System-owner only. role_key and permissions remain locale-neutral; label_en/label_hu and description_en/description_hu are display metadata. Wildcard and system-owner approval authority are not delegable.
      responses:
        "201": {description: Custom role created}
        "403": {description: System owner required}
        "409": {description: Reserved or duplicate role key}
  /api/v1/admin/roles/{roleKey}:
    parameters:
      - {name: roleKey, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Administration]
      summary: Update custom role bilingual metadata, permissions or active state
      responses:
        "200": {description: Custom role updated}
        "409": {description: Built-in role protected or custom role still assigned}
  /api/v1/admin/users:
    get:
      tags: [Administration]
      summary: List HIMATE administration users
      responses:
        "200": {description: User list}
        "403": {description: System owner required}
    post:
      tags: [Administration]
      summary: Create a role-scoped HIMATE user
      description: System-owner only. The platform_admin/system-owner authority is not delegable here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, roles]
              properties:
                name: {type: string}
                email: {type: string, format: email}
                password: {type: string, format: password, minLength: 12}
                roles:
                  type: array
                  items:
                    type: string
                    enum: [operations_admin, finance_admin, reporting_admin]
      responses:
        "201": {description: User created}
        "403": {description: System owner required}
        "409": {description: Duplicate email or reserved owner role}
  /api/v1/admin/users/{userId}:
    patch:
      tags: [Administration]
      summary: Update user identity, roles, active state or temporary password
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: User updated}
        "403": {description: System owner required}
        "409": {description: Owner protection or continuity guard}
  /api/v1/admin/secrets:
    get:
      tags: [Administration]
      summary: List write-only platform secret configuration status
      description: Returns metadata and CONFIGURED/MISSING state only. Raw secret values are never returned.
      responses:
        "200": {description: Supported provider-secret metadata and configuration state}
  /api/v1/admin/secrets/{secretKey}:
    parameters:
      - {name: secretKey, in: path, required: true, schema: {type: string, enum: [stripe_secret_key, stripe_webhook_secret, render_api_key]}}
    put:
      tags: [Administration]
      summary: Create or replace one encrypted platform secret
      description: System-owner only. The request value is AES-256-GCM encrypted before storage and is redacted from audit state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {type: string, format: password, minLength: 1, maxLength: 8192, writeOnly: true}
      responses:
        "200": {description: Secret stored; response contains metadata only}
        "403": {description: System owner required}
        "404": {description: Secret key is not allowlisted}
    delete:
      tags: [Administration]
      summary: Remove one encrypted platform secret
      description: System-owner only. Dependent provider operations return configuration-required errors until a replacement is configured.
      responses:
        "204": {description: Secret removed}
        "403": {description: System owner required}
        "404": {description: Secret not configured or not allowlisted}
  /api/v1/audit/events:
    get:
      tags: [Audit]
      summary: Query immutable governance audit events
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: q, in: query, schema: {type: string}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: resource, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: correlation_id, in: query, schema: {type: string}}
        - {name: method, in: query, schema: {type: string}}
        - {name: outcome, in: query, schema: {type: string}}
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Paginated immutable audit events including semantic action, correlation and redacted old/new state
        "400": {description: Invalid time filter}
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Permission-filtered notification feed for the authenticated administrator
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: unread_only, in: query, schema: {type: boolean}}
      responses:
        "200": {description: Visible notification items and unread count}
  /api/v1/notifications/{notificationId}/read:
    parameters:
      - {name: notificationId, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Notifications]
      summary: Mark one visible notification as read
      responses:
        "200": {description: Notification marked read}
        "403": {description: Notification outside permission scope}
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all visible notifications as read for the authenticated administrator
      responses:
        "200": {description: Visible notifications marked read}
  /partner/api/v1/auth/login:
    post:
      tags: [Partner Portal]
      security: []
      summary: Partner Portal sign in
      description: Issues a separate HttpOnly session cookie scoped to /partner. Tenant scope comes from the authenticated partner identity.
      responses:
        "200": {description: Authenticated partner user}
        "401": {description: Invalid credentials}
        "403": {description: Partner Portal access suspended or archived}
        "429": {description: Sign-in rate limited}
  /partner/api/v1/auth/logout:
    post:
      tags: [Partner Portal]
      summary: End Partner Portal session
      responses:
        "204": {description: Session ended}
  /partner/api/v1/auth/me:
    get:
      tags: [Partner Portal]
      summary: Current tenant-scoped Partner Portal identity
      responses:
        "200": {description: Partner identity, partner_id, role and portal permissions}
        "401": {description: Partner authentication required}
  /partner/api/v1/dashboard:
    get:
      tags: [Partner Portal]
      summary: Tenant-scoped portal overview
      description: Partner identifier is taken only from the authenticated session; query/body partner_id values are ignored.
      responses:
        "200": {description: Company, module, billing and Impact overview}
        "403": {description: Partner access disabled}
  /partner/api/v1/company:
    get:
      tags: [Partner Portal]
      summary: Read own company profile
      responses:
        "200": {description: Own partner company profile}
    patch:
      tags: [Partner Portal]
      summary: Update allowlisted own-company identity/contact fields
      description: Lifecycle, pricing, infrastructure and HIMATE-only controls are not accepted by this portal route.
      responses:
        "200": {description: Updated own-company profile}
        "403": {description: Portal role lacks company.write}
  /partner/api/v1/modules:
    get:
      tags: [Partner Portal]
      summary: Tenant-scoped Module Marketplace with plan-aware access state
      description: >
        Returns the discoverable HIMATE module catalog for the authenticated tenant.
        The canonical 38-module portfolio remains visible for product discovery even
        before live release. Marketplace visibility never grants execution: executable
        requires PUBLISHED + READY + operational ACTIVE, and plan-managed access also
        requires an ACTIVE tenant entitlement. access_state is ACTIVE, LOCKED,
        COMING_SOON or UNAVAILABLE. Gateway enrichment adds available_in_plans,
        upgrade_plan_keys and recommended_upgrade_plan from Billing without changing
        Billing authority. Arbitrary unpublished modules that are not marketplace_visible
        remain hidden.
      responses:
        "200": {description: Tenant Module Marketplace with discovery, execution and plan-access state}
  /partner/api/v1/modules/{moduleKey}/activate:
    parameters:
      - {name: moduleKey, in: path, required: true, schema: {type: string}}
    post:
      tags: [Partner Portal]
      summary: Activate an eligible module for the authenticated tenant
      description: Backend enforces PUBLISHED + commercial_ready, availability, REQUIRES and CONFLICTS_WITH relationships. Catalog reference prices, source and dependency metadata are immutable to partners.
      responses:
        "200": {description: Module activated and billing synchronized}
        "409": {description: Unpublished, unconfigured commercial terms, dependency, conflict, maintenance or availability gate blocked activation}
  /partner/api/v1/modules/{moduleKey}/subscription:
    parameters:
      - {name: moduleKey, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Partner Portal]
      summary: Schedule or withdraw end-of-period cancellation through the authoritative Billing lifecycle
      responses:
        "200": {description: Subscription renewal state updated}
        "409": {description: Subscription state does not allow the requested change}
  /partner/api/v1/billing/summary:
    get:
      tags: [Partner Portal]
      summary: Own current billing and subscription summary
      responses:
        "200": {description: Tenant billing summary}
  /partner/api/v1/plans:
    get:
      tags: [Partner Portal]
      summary: Customer-selectable Starter, Business and Flex plans
      description: Returns monthly price, annual list price, discounted annual price, module capacity and selection mode. CUSTOM is not exposed to Partner Portal users.
      responses:
        "200": {description: Customer-selectable subscription plans}
  /partner/api/v1/plan:
    get:
      tags: [Partner Portal]
      summary: Own current subscription plan
      responses:
        "200": {description: Current plan, frequency, renewal boundary and scheduled change}
    patch:
      tags: [Partner Portal]
      summary: Select, upgrade or schedule downgrade of own subscription plan
      description: Same-frequency upgrades are immediate and charge the complete plan-price difference without proration. Monthly downgrades take effect next calendar-month day 1; annual downgrades take effect at annual renewal.
      responses:
        "200": {description: Plan changed or scheduled}
        "409": {description: Activation license required, plan not ready or commercial transition blocked}
  /partner/api/v1/plan/modules:
    get:
      tags: [Partner Portal]
      summary: Own current plan module set
      responses:
        "200": {description: Current fixed or Flex module set}
    put:
      tags: [Partner Portal]
      summary: Schedule next Flex module selection
      description: Flex supports up to 15 PUBLISHED and READY modules. Normal selection changes take effect at the next calendar-month boundary.
      responses:
        "200": {description: Flex module set scheduled}
        "409": {description: Current plan is fixed or module is not ready}
  /partner/api/v1/charity:
    get:
      tags: [Partner Portal]
      summary: Read own Charity review and commercial-mode state
      responses:
        "200": {description: Own Charity/commercial state}
  /partner/api/v1/charity/request:
    post:
      tags: [Partner Portal]
      summary: Submit own organization for HIMATE Charity review
      description: Submission only creates a PENDING review; Partner Portal users cannot approve themselves.
      responses:
        "202": {description: Charity review request submitted}
  /partner/api/v1/charity/modules:
    get:
      tags: [Partner Portal]
      summary: Read own approved Charity module selection
      responses:
        "200": {description: Own Charity module selection}
    put:
      tags: [Partner Portal]
      summary: Choose modules after HIMATE Charity approval
      description: No module-count cap applies to approved Charity partners. Only PUBLISHED and READY modules are accepted.
      responses:
        "200": {description: Charity module selection updated}
        "409": {description: HIMATE Charity approval is required}
  /partner/api/v1/billing/subscriptions:
    get:
      tags: [Partner Portal]
      summary: Own module subscription periods and renewal state
      responses:
        "200": {description: Tenant module subscriptions}
  /partner/api/v1/billing/invoices:
    get:
      tags: [Partner Portal]
      summary: Own invoice history
      responses:
        "200": {description: Tenant invoices}
  /partner/api/v1/impact/summary:
    get:
      tags: [Partner Portal]
      summary: Own aggregated Impact results
      responses:
        "200": {description: Tenant Impact metrics}
  /partner/api/v1/users:
    get:
      tags: [Partner Portal]
      summary: List own organization Portal users
      responses:
        "200": {description: Tenant Portal users}
    post:
      tags: [Partner Portal]
      summary: Create an own-tenant Portal user
      description: Portal roles are owner, admin, billing and viewer; they cannot grant HIMATE control-plane roles.
      responses:
        "201": {description: Tenant Portal user created}
        "403": {description: Role lacks users.write or non-owner attempted to assign owner}
  /partner/api/v1/users/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Partner Portal]
      summary: Update an own-tenant Portal user
      description: Last active owner is protected; role/status changes rotate the target session version.
      responses:
        "200": {description: Tenant Portal user updated}
        "403": {description: Cross-role authority denied}
        "409": {description: Last-owner continuity guard}
  /partner/api/v1/design:
    get:
      tags: [Partner Portal]
      summary: Read the own-tenant design catalog, active profile and effective visual theme
      description: Theme state is independent from CMS content, modules, billing and workflow state.
      responses:
        "200": {description: Catalog plus partner-owned profiles and active_profile_id}
        "403": {description: design.read permission required}
  /partner/api/v1/design/media:
    get:
      tags: [Partner Portal]
      summary: List own-tenant brand assets
      responses:
        "200": {description: Tenant-owned checksum-backed design media}
    post:
      tags: [Partner Portal]
      summary: Upload an own-tenant brand asset
      description: PNG/JPEG/WebP only; stored through CMS Storage with tenant ownership and SHA-256 integrity.
      responses:
        "201": {description: Tenant-owned design media created}
        "403": {description: design.write permission required}
  /partner/api/v1/design/profiles:
    post:
      tags: [Partner Portal]
      summary: Create an own-tenant custom design profile
      description: Stores visual tokens and brand asset IDs only; content and business mechanics are not part of the profile.
      responses:
        "201": {description: Partner design profile created}
        "403": {description: design.write permission required}
  /partner/api/v1/design/profiles/{profileId}:
    parameters:
      - {name: profileId, in: path, required: true, schema: {type: string}}
    put:
      tags: [Partner Portal]
      summary: Update an own-tenant custom design profile
      description: Catalog-owned profiles are immutable to partner users.
      responses:
        "200": {description: Partner design profile updated}
        "403": {description: Cross-tenant or catalog profile edit denied}
  /partner/api/v1/design/profiles/{profileId}/activate:
    parameters:
      - {name: profileId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Partner Portal]
      summary: Activate a catalog or own-tenant design profile
      description: >
        Changes only cms.design_scope_state.active_profile_id. Content, partner
        data, module state, billing, workflows and application mechanics remain unchanged.
      responses:
        "200": {description: Active design changed with content_binding/mechanics_binding unchanged}
        "403": {description: design.write permission required}
        "404": {description: Profile is neither visible catalog design nor own-tenant design}
  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Authoritative executive Dashboard summary
      description: >
        Aggregates partner/module counts, Billing-paid YTD revenue, the authoritative
        People Reached Impact metric, a 12-month trend and permission-filtered recent
        audit activity. Revenue is grouped by original currency with no implicit FX conversion.
        Billing analytics require billing.read; Impact analytics require impact.read. Restricted
        domains return an explicit authorized=false marker without sensitive values.
      parameters:
        - {name: year, in: query, schema: {type: integer, minimum: 2000, maximum: 2100}}
        - {name: refresh, in: query, schema: {type: boolean}, description: Bypass the shared current-year Dashboard cache}
      responses:
        "200": {description: Dashboard KPI, analytics, trend and permission-filtered activity snapshot}
        "400": {description: Invalid year}
  /api/v1/search:
    get:
      tags: [Dashboard]
      summary: Permission-scoped global control-plane search
      description: >
        Searches only authoritative domains for which the authenticated administrator
        already has read permission. Search never broadens authorization and does not
        use a shadow search database.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 5}}
      responses:
        "200": {description: Permission-scoped results from permitted authoritative domains}
        "400": {description: Search query shorter than 2 or longer than 100 characters}
        "403": {description: Dashboard read permission required}
  /api/v1/partner-categories:
    get:
      tags: [Partners]
      summary: List locale-resolved bilingual partner categories
      description: Response retains name_en/name_hu; legacy name resolves to the requested locale.
      responses:
        "200": {description: Partner categories}
    post:
      tags: [Partners]
      summary: Create a bilingual partner category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_en, name_hu]
              properties:
                name_en: {type: string}
                name_hu: {type: string}
                name: {type: string, deprecated: true, description: Legacy fallback accepted for historical clients}
      responses:
        "201": {description: Category created with both language variants}
        "409": {description: Category already exists}
  /api/v1/partners:
    get:
      tags: [Partners]
      summary: Paginated partner portfolio
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: q, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: lifecycle, in: query, schema: {type: string}}
        - {name: health, in: query, schema: {type: string, enum: [ALL, HEALTHY, WARNING, OFFLINE, UNKNOWN]}}
        - {name: include_archived, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Partner portfolio with aggregate card data
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Partner"}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  has_more: {type: boolean}
                  lifecycle_counts:
                    type: object
                    additionalProperties: {type: integer}
    post:
      tags: [Partners]
      summary: Create a PROSPECT partner record
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewPartner"}
      responses:
        "200": {description: Existing partner returned for an idempotent onboarding replay}
        "201": {description: Partner created}
        "400": {description: Invalid JSON payload or partner validation error}
        "409": {description: Primary domain is already assigned to another partner}
        "503": {description: Partner onboarding is blocked because one or more required microservices are unavailable, unversioned, or running a different release}
  /api/v1/partners/{partnerId}/logo:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    post:
      tags: [Partners]
      summary: Upload and assign the partner company logo
      description: >
        Stores a PNG, JPEG or WebP image in the partner-scoped CMS media library,
        registers it as the partner's public logo asset, and updates logo_url on
        the authoritative partner master record.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: {type: string, format: binary}
                purpose: {type: string, const: logo}
                alt_text: {type: string, maxLength: 240}
      responses:
        "201": {description: Logo stored, published for partner-brand use and linked to the partner}
        "400": {description: Invalid multipart request or unsupported purpose}
        "404": {description: Partner not found}
        "415": {description: Logo must be PNG, JPEG or WebP}
        "502": {description: CMS or storage unavailable}
        "503": {description: Partner logo onboarding is blocked by a microservice release mismatch}
  /api/v1/partners/{partnerId}/portal-users:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Administration]
      summary: List Partner Portal identities for one partner
      responses:
        "200": {description: Partner Portal users}
        "403": {description: HIMATE System Owner required}
    post:
      tags: [Administration]
      summary: Bootstrap a Partner Portal identity
      description: HIMATE System Owner only; typically used to create the first partner Owner.
      responses:
        "201": {description: Partner Portal user created}
        "403": {description: HIMATE System Owner required}
  /api/v1/partners/{partnerId}/portal-users/{userId}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
      - {name: userId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Administration]
      summary: Update a Partner Portal identity from HIMATE administration
      responses:
        "200": {description: Partner Portal user updated}
        "403": {description: HIMATE System Owner required}
  /api/v1/partners/{partnerId}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Partners]
      summary: Partner record
      responses:
        "200": {description: Partner}
        "404": {description: Partner not found}
    patch:
      tags: [Partners]
      summary: Update partner company data or lifecycle
      description: >
        Lifecycle transitions are backend-enforced and historized. Entering
        PROVISIONING fails closed unless Billing confirms the authoritative
        initial-license payment/evidence gate (or an explicit valid waiver).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartnerUpdate"}
      responses:
        "200": {description: Updated partner}
        "409": {description: Invalid lifecycle transition or uniqueness conflict}
  /api/v1/module-groups:
    get:
      tags: [Modules]
      summary: Locale-resolved bilingual module groups
      description: Each item includes label_en/label_hu; label resolves to the requested locale.
      responses:
        "200": {description: Module groups}
    post:
      tags: [Modules]
      summary: Create a stable bilingual module group
      description: Stable group_key is language-neutral; new UI mutations provide label_en and label_hu.
      responses:
        "201": {description: Module group created with bilingual labels}
  /api/v1/module-groups/{groupKey}:
    parameters:
      - {name: groupKey, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Modules]
      summary: Update bilingual module-group labels or sort order
      responses:
        "200": {description: Module group updated}
  /api/v1/modules:
    get:
      tags: [Modules]
      summary: Locale-resolved bilingual module catalog
      responses:
        "200": {description: Canonical and custom modules}
    post:
      tags: [Modules]
      summary: Create module registry entry with bilingual metadata, implementation state and publication state
      responses:
        "201": {description: Module created}
        "409": {description: Stable key conflict}
  /api/v1/modules/{moduleKey}:
    parameters:
      - name: moduleKey
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Modules]
      summary: Update catalog metadata, implementation state, publication state or availability
      responses:
        "200": {description: Updated catalog module}
  /api/v1/modules/{moduleKey}/relationships:
    parameters:
      - {name: moduleKey, in: path, required: true, schema: {type: string}}
    get:
      tags: [Modules]
      summary: List directed module relationships
      responses:
        "200": {description: Module dependency/integration relationships}
    post:
      tags: [Modules]
      summary: Create or update a directed module relationship
      responses:
        "201": {description: Relationship saved}
  /api/v1/modules/{moduleKey}/relationships/{targetModuleKey}:
    parameters:
      - {name: moduleKey, in: path, required: true, schema: {type: string}}
      - {name: targetModuleKey, in: path, required: true, schema: {type: string}}
      - {name: type, in: query, required: true, schema: {type: string}}
    delete:
      tags: [Modules]
      summary: Delete a directed module relationship
      responses:
        "204": {description: Relationship removed}
  /api/v1/modules/{moduleKey}/impact-metrics:
    parameters:
      - {name: moduleKey, in: path, required: true, schema: {type: string}}
    get:
      tags: [Modules]
      summary: List Impact metric mappings for a module
      responses:
        "200": {description: Metric mappings}
    put:
      tags: [Modules]
      summary: Replace Impact metric mappings for a module
      responses:
        "200": {description: Metric mappings updated}
  /api/v1/modules/{moduleKey}/usage:
    parameters:
      - {name: moduleKey, in: path, required: true, schema: {type: string}}
    get:
      tags: [Modules]
      summary: Read partner entitlement usage for a module
      responses:
        "200": {description: Partner usage and status counts}
  /api/v1/module-commercial-matrix:
    get:
      tags: [Modules]
      summary: Partner × Module commercial control-plane matrix
      parameters:
        - {name: partner_ids, in: query, required: true, schema: {type: string}, description: Comma-separated partner IDs, maximum 200}
      responses:
        "200": {description: Effective recurring prices, activation fees, assignment state and scheduled commercial changes}
  /api/v1/partners/{partnerId}/modules:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Modules]
      summary: Partner module entitlements and contract pricing
      description: >
        Catalog prices are reference values only. Partner charging authority is the
        partner-specific contract/quote configuration.
      responses:
        "200": {description: Partner modules, lifecycle state and contract pricing}
  /api/v1/partners/{partnerId}/modules/{moduleKey}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
      - name: moduleKey
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Modules]
      summary: Update partner module entitlement and individual contract pricing
      description: >
        Partner-specific commercial configuration includes contract currency,
        quote_reference, base-package inclusion, recurring module price and module
        activation fee. Recurring pricing accepts an optional RFC3339 or YYYY-MM-DD
        price_effective_at. Partner-specific one-time activation fees accept
        activation_fee_effective_at. Historical changes retain actor, reason, old
        value, new value, contract currency and quote reference.
      responses:
        "200": {description: Updated partner module}
  /api/v1/partners/{partnerId}/modules/{moduleKey}/commercial-history:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
      - {name: moduleKey, in: path, required: true, schema: {type: string}}
    get:
      tags: [Modules]
      summary: Partner-module commercial and entitlement change history
      responses:
        "200": {description: Effective-dated old/new values, actor and reason}
  /api/v1/billing/profile:
    get:
      tags: [Billing]
      summary: HIMATE issuer and banking profile
      responses:
        "200": {description: Billing profile}
    put:
      tags: [Billing]
      summary: Update HIMATE issuer and banking profile
      responses:
        "200": {description: Updated billing profile}
  /api/v1/billing/plans:
    get:
      tags: [Billing]
      summary: Subscription plan catalog
      description: >
        Central package catalog. Initial standard monthly prices are Starter USD 500,
        Business USD 1,500 and Flex USD 2,500; HIMATE may change package prices with an
        effective date. Standard package prices apply to active customers from the
        applicable billing boundary. Every January 1 the then-effective package price
        automatically increases by 5 percent. Historical invoices are immutable.
      responses:
        "200": {description: Plans with module limits, selection modes, annual savings and readiness}
  /api/v1/billing/plans/{planKey}:
    parameters:
      - in: path
        name: planKey
        required: true
        schema: {type: string}
    get:
      tags: [Billing]
      summary: Subscription plan detail
      responses:
        "200": {description: Plan detail and current fixed module set}
    patch:
      tags: [Billing]
      summary: Update plan commercial fields or fixed module package
      description: >
        Starter is fixed at 3 modules and Business at 10 modules, both selected by HIMATE.
        Flex is fixed at a maximum capacity of 15 partner-selected modules. Price changes
        accept effective_at and reason, are stored in effective-dated price history, and
        apply to all active customers from the applicable billing boundary.
      responses:
        "200": {description: Plan updated}
        "400": {description: Invalid plan values or module count}
        "409": {description: Module not PUBLISHED/READY or incompatible selection mode}
  /api/v1/billing/partners/{partnerId}/plan:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema: {type: string}
    get:
      tags: [Billing]
      summary: Partner subscription plan
      responses:
        "200": {description: Plan state, billing frequency, prices, modules and scheduled change}
    put:
      tags: [Billing]
      summary: Create partner plan subscription
      responses:
        "201": {description: Plan subscription created}
        "409": {description: Activation license must be paid or waived}
    patch:
      tags: [Billing]
      summary: Change partner subscription plan
      description: Same-frequency price upgrades are immediate and collect the full price difference. Downgrades are scheduled with no refund. CUSTOM is available for HIMATE-administered negotiated partners. Recurring charges are collected automatically from the saved provider payment method. Failed recurring collection retries on due date, due+2 and due+5 days; the third failure suspends service and starts a 30-day cure window before retention-safe operational account purge.
      responses:
        "200": {description: Plan changed or scheduled}
  /api/v1/billing/partners/{partnerId}/plan/modules:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema: {type: string}
    get:
      tags: [Billing]
      summary: Partner plan module set
      responses:
        "200": {description: Current fixed or Flex selection}
    put:
      tags: [Billing]
      summary: Schedule Flex module set
      responses:
        "200": {description: Module set scheduled for next month boundary}
        "409": {description: Fixed plan cannot be individually reconfigured}
  /api/v1/billing/partners/{partnerId}/terms:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Partner commercial terms
      responses:
        "200": {description: Commercial terms}
    put:
      tags: [Billing]
      summary: Update partner-specific commercial terms
      description: >
        Persists partner-specific activation fee, legacy/CUSTOM service fee, optional
        minimum monthly commitment, quote reference and a monotonic terms version.
        There is no platform-enforced positive minimum: zero-dollar and discounted
        commercial terms are valid HIMATE administrator decisions. Starter/Business/Flex
        recurring charges are controlled by central package prices, while activation fees
        remain partner-specific.
      responses:
        "200": {description: Updated individual commercial terms and commercial mode}
        "400": {description: Invalid commercial amount or date}
        "409": {description: Commercial terms changed concurrently}
  /api/v1/billing/partners/{partnerId}/terms-history:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Read versioned partner commercial-term snapshots
      responses:
        "200": {description: Descending partner commercial-term versions with actor and reason}
  /api/v1/billing/partners/{partnerId}/agreement:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Read the explicit commercial agreement state
      responses:
        "200": {description: DRAFT or AGREED agreement state}
    put:
      tags: [Billing]
      summary: Confirm or return a commercial agreement to draft
      description: >
        AGREED requires a persistent signed-agreement reference. This approval
        participates in the provisioning gate and is recorded in the immutable
        billing event ledger.
      responses:
        "200": {description: Updated commercial agreement}
        "400": {description: Agreement validation failed}
  /api/v1/billing/partners/{partnerId}/commercial-status:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Commercial activation workflow and provisioning readiness
      description: >
        Aggregates agreement, activation-fee state, payment evidence, commercial mode
        and initial-license state. PAID partners retain provider-backed payment gates.
        HIMATE-approved COMPLIMENTARY and approved CHARITY partners with a valid waiver
        may proceed without fabricated invoice or payment evidence.
      responses:
        "200": {description: Workflow steps, next action and provisioning gate}
  /api/v1/billing/partners/{partnerId}/commercial-mode:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Read PAID, COMPLIMENTARY or CHARITY commercial mode
      responses:
        "200": {description: Billing mode, Charity review state and invoice-generation policy}
    patch:
      tags: [Billing]
      summary: HIMATE approval of commercial mode and Charity review state
      description: >
        Requires billing approval authority. CHARITY cannot become effective until
        charity_status is APPROVED. Changes are audit-history and billing-event backed.
      responses:
        "200": {description: Updated commercial mode}
        "409": {description: Charity approval is required}
  /api/v1/billing/partners/{partnerId}/charity/request:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    post:
      tags: [Billing]
      summary: Request Charity eligibility review
      responses:
        "202": {description: Charity review pending}
  /api/v1/billing/partners/{partnerId}/charity/modules:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Read approved Charity module selection
      responses:
        "200": {description: Selected modules with no Charity module-count cap}
    put:
      tags: [Billing]
      summary: Replace approved Charity module selection
      description: >
        Available only after HIMATE Charity approval. Any number of PUBLISHED and READY
        canonical modules may be selected; Catalog entitlements are synchronized with
        CHARITY as the entitlement source.
      responses:
        "200": {description: Charity module selection applied}
        "409": {description: Charity approval required or module unavailable}
  /api/v1/billing/partners/{partnerId}/events:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Immutable commercial and module billing event ledger
      description: >
        Includes commercial agreement, activation payment, module activation,
        period start/end, renewal, cancellation, invoice-item and invoice events.
      responses:
        "200": {description: Billing event ledger}
  /api/v1/billing/partners/{partnerId}/license:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Initial activation-license state
      responses:
        "200": {description: Initial license including provider-settled paid state}
    put:
      tags: [Billing]
      summary: Configure activation-license commercial state
      description: >
        Administrator may configure currency, required amount, waiver and note.
        paid_amount, payment_date, payment_reference and verified_by are
        provider-managed and are rejected if supplied by an administrator.
      responses:
        "200": {description: Updated activation-license configuration}
        "409": {description: Provider-managed payment fields cannot be written manually}
  /api/v1/billing/partners/{partnerId}/license/collect:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    post:
      tags: [Billing, Payments]
      summary: Start idempotent provider collection for the activation license
      description: >
        Requires Billing approval authority. Billing resolves the authoritative
        amount/currency and asks Payments to create the provider attempt.
        The license remains unpaid until a verified provider webhook settles it.
      responses:
        "201": {description: Payment attempt created or returned idempotently}
        "409": {description: License waived/already paid or payment profile not ready}
        "502": {description: Payment provider service unavailable}
  /api/v1/payments/partners/{partnerId}/profile:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Payments]
      summary: Read provider payment profile
      responses:
        "200": {description: Provider customer/payment-method readiness and autopay state}
    put:
      tags: [Payments]
      summary: Configure provider customer, saved payment method and autopay
      description: >
        Provider secrets never pass through this route. Only provider object
        identifiers and the autopay preference are persisted.
      responses:
        "200": {description: Updated payment profile}
        "409": {description: Autopay requested without a ready payment method}
  /api/v1/payments/partners/{partnerId}/attempts:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Payments]
      summary: Read persisted payment attempts and reconciliation state
      responses:
        "200": {description: Provider attempts including purpose, amount, provider ID and status}
  /api/v1/billing/partners/{partnerId}/summary:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Current commercial billing summary
      responses:
        "200": {description: Plan-based summary for managed-plan partners or legacy negotiated-cycle summary for legacy/CUSTOM partners}
  /api/v1/billing/partners/{partnerId}/documents:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Commercial document metadata
      responses:
        "200": {description: Documents}
    post:
      tags: [Billing]
      summary: Register commercial document metadata
      description: >
        Commercial evidence types (CONTRACT, INVOICE, RECEIPT and
        PAYMENT_EVIDENCE) require a same-partner file-backed HIMATE Evidence
        reference in evidence://<evidence-id> form. Billing performs a fresh
        Evidence/Storage SHA-256 and byte-size integrity verification and uses
        the authoritative MIME/hash/size metadata instead of trusting client
        values before the document can satisfy the initial-license gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind:
                  type: string
                  enum: [CONTRACT, INVOICE, RECEIPT, PAYMENT_EVIDENCE, OTHER]
                name: {type: string}
                storage_url: {type: string, maxLength: 2048}
                note: {type: string}
                verified_by: {type: string}
                mime_type: {type: string}
                sha256: {type: string}
                size_bytes: {type: integer, minimum: 0}
      responses:
        "201": {description: Document registered}
        "400": {description: Basic document validation failed}
        "409": {description: Commercial Evidence reference is missing, cross-partner, not file-backed or fails fresh storage integrity verification}
  /api/v1/billing/partners/{partnerId}/invoices:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Itemized invoice records
      description: >
        Each invoice includes immutable BASE_SERVICE and MODULE line items.
        Module line-item amounts come from period-start price snapshots and are
        never recalculated from the current Catalog price.
      responses:
        "200": {description: Invoices with immutable itemized line items}
  /api/v1/billing/subscription-matrix:
    get:
      tags: [Billing]
      summary: Batched authoritative subscription lifecycle and exact renewal-period commercial quotes
      parameters:
        - {name: partner_ids, in: query, required: true, schema: {type: string}, description: Comma-separated partner IDs, maximum 200}
      responses:
        "200": {description: Current immutable period plus ACTIVE/CANCEL_PENDING/INACTIVE lifecycle; next-period quote is present only for an actively renewing subscription}
        "502": {description: Catalog point-in-time pricing could not be resolved}
  /api/v1/billing/partners/{partnerId}/subscriptions:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Module subscription snapshots
      responses:
        "200": {description: Subscription records}
  /api/v1/billing/partners/{partnerId}/subscriptions/{moduleKey}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
      - name: moduleKey
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Billing]
      summary: Authoritatively schedule or withdraw end-of-period cancellation
      description: Billing owns the ACTIVE/CANCEL_PENDING/INACTIVE lifecycle. Cancellation preserves the current immutable 30-day period, prevents renewal, and becomes INACTIVE only when the Billing cycle closes the exact period boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancel_at_period_end]
              properties:
                cancel_at_period_end: {type: boolean}
                reason: {type: string}
      responses:
        "200": {description: Subscription updated with lifecycle_state and cancellation_effective_at}
        "404": {description: Subscription not found}
        "409": {description: Inactive subscription must be reactivated at module level}
  /webhooks/stripe:
    post:
      tags: [Payments]
      security: []
      summary: Receive signed Stripe PaymentIntent webhooks
      description: >
        Signature verification uses the exact raw request body, Stripe-Signature
        and the runtime endpoint secret. Successful events must match the
        persisted attempt payment ID, amount and currency before Billing
        settlement is requested. Exact processed-event retries are idempotent.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: {type: string}
      responses:
        "200": {description: Event processed, ignored or recognized as an exact duplicate}
        "400": {description: Signature or payload invalid}
        "409": {description: Attempt/payment/amount mismatch or event-ID payload conflict}
        "502": {description: Provider event verified but Billing settlement temporarily failed}
  /api/v1/public/contact:
    post:
      tags: [Public]
      security: []
      summary: Public contact inquiry
      responses:
        "201": {description: Inquiry accepted}
        "429": {description: Rate limited}
  /api/v1/contact/inquiries:
    get:
      tags: [Contact]
      summary: List inbound website contact leads
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ALL, NEW, IN_PROGRESS, CONTACTED, CLOSED]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200": {description: Paginated contact leads}
        "403": {description: Contact read permission required}
  /api/v1/contact/inquiries/{inquiryId}:
    get:
      tags: [Contact]
      summary: Read a contact lead
      parameters:
        - {name: inquiryId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Contact lead}
        "404": {description: Contact lead not found}
    patch:
      tags: [Contact]
      summary: Update contact lead workflow state
      parameters:
        - {name: inquiryId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lead_status: {type: string, enum: [NEW, IN_PROGRESS, CONTACTED, CLOSED]}
                assigned_to: {type: string, maxLength: 160}
                admin_note: {type: string, maxLength: 4000}
      responses:
        "200": {description: Contact lead updated}
        "400": {description: Invalid workflow state}
        "403": {description: Contact write permission required}
        "404": {description: Contact lead not found}
  /api/v1/provisioning/jobs:
    get:
      tags: [Provisioning]
      summary: List provisioning jobs
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
      responses:
        "200": {description: Provisioning jobs}
    post:
      tags: [Provisioning]
      summary: Prepare, start or resume idempotent partner provisioning
      description: >
        With prepare_only=true the complete provisioning plan is persisted before
        the commercial gate without allocating partner infrastructure. Execution
        requires READY_TO_PROVISION/PROVISIONING/CONFIGURATION and a satisfied
        initial-license gate. The workflow creates isolated database/role and
        storage, applies the structure-only template and module preset, publishes
        connector desired state, deploys staging and verifies database, storage and
        runtime health. Successful steps are not repeated on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id]
              properties:
                partner_id: {type: string}
                system_name: {type: string}
                admin_email: {type: string, format: email}
                platform_version: {type: string}
                desired_release: {type: string}
                environment: {type: string, enum: [STAGING], default: STAGING}
                prepare_only: {type: boolean, default: false}
                module_preset:
                  type: array
                  items: {type: string}
      responses:
        "202": {description: Provisioning completed to configuration-required state}
        "409": {description: License/lifecycle/dependency gate blocked or workflow incomplete}
  /api/v1/provisioning/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Provisioning]
      summary: Provisioning job and step history
      responses:
        "200": {description: Provisioning job}
  /api/v1/provisioning/jobs/{jobId}/run:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Provisioning]
      summary: Resume an incomplete provisioning job
      responses:
        "200": {description: Job resumed/completed}
        "409": {description: Job still blocked or failed}
  /api/v1/environments:
    get:
      tags: [Environments]
      summary: List partner staging/production environments
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
      responses:
        "200": {description: Partner environments}
    post:
      tags: [Environments]
      summary: Register a staging or production environment
      responses:
        "201": {description: Environment created}
        "409": {description: Duplicate environment or hostname}
  /api/v1/environments/{environmentId}:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Environments]
      summary: Update environment hostname, platform version, desired release and configuration
      description: |
        Changing a production hostname resets DNS/TLS verification. LIVE cannot
        be set directly; production must pass the launch gate.
      responses:
        "200": {description: Updated environment}
        "409": {description: Direct LIVE transition rejected by launch gate}
  /api/v1/environments/{environmentId}/verify-domain:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Environments]
      summary: Verify environment DNS and TLS readiness
      description: |
        Performs a live DNS lookup and TLS handshake for public hostnames and
        persists DNS, TLS, domain status, last check time and diagnostic error.
      responses:
        "200": {description: Environment with current domain verification state}
  /api/v1/environments/{environmentId}/deploy:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Environments]
      summary: Deploy or redeploy an environment release
      description: |
        Deploys STAGING or PRODUCTION through the private partner runtime.
        Production remains configuration-required until all launch gates pass.
      responses:
        "200": {description: Deployed environment}
        "502": {description: Runtime deployment failed}
  /api/v1/environments/{environmentId}/launch:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Environments]
      summary: Transition production READY FOR LAUNCH to LIVE
      description: |
        Re-checks runtime health and requires DEPLOYED runtime, active release,
        verified domain, DNS and TLS. Records launch actor and timestamp.
      responses:
        "200": {description: Production environment is LIVE}
        "409": {description: One or more launch gates are not satisfied}
  /api/v1/connectors/{partnerId}/website-adapter:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Connector]
      summary: Read Partner Website Adapter configuration
      parameters:
        - {name: environment, in: query, schema: {type: string, enum: [STAGING, PRODUCTION], default: PRODUCTION}}
      responses:
        "200": {description: Adapter type, domain allowlist, capabilities and privacy mode}
    put:
      tags: [Connector]
      summary: Configure an existing partner website integration
      description: >
        Configures the Connector boundary only; it does not create or replace
        the partner website. The partner primary domain must be in the adapter
        allowlist before connector commercial-state access succeeds.
      responses:
        "200": {description: Website adapter configuration}
        "400": {description: URL, domain or capability validation failed}
  /api/v1/connectors/{partnerId}/credential:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Connector]
      summary: Connector credential metadata
      description: Raw credentials are never returned by GET.
      responses:
        "200": {description: Credential metadata}
    post:
      tags: [Connector]
      summary: Create or rotate a partner/environment connector credential
      description: The raw bearer token is returned once; HIMATE stores only its hash.
      responses:
        "201": {description: One-time raw token and credential metadata}
  /api/v1/connectors/{partnerId}/desired-state:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Connector]
      summary: Read the desired partner state for an environment
      parameters:
        - {name: environment, in: query, schema: {type: string, enum: [STAGING, PRODUCTION], default: STAGING}}
      responses:
        "200": {description: Versioned entitlement, maintenance and configuration desired state}
    put:
      tags: [Connector]
      summary: Replace the desired partner state for an environment
      responses:
        "200": {description: Updated desired state and revision}
  /connector/v1/heartbeat:
    post:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Partner connector heartbeat and version/module state
      responses:
        "200": {description: Heartbeat accepted}
        "401": {description: Invalid connector credential}
  /connector/v1/state:
    get:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Read connector state for the authenticated partner/environment
      responses:
        "200": {description: Connector state}
  /connector/v1/desired-state:
    get:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Fetch entitlement, maintenance and configuration desired state for the authenticated partner/environment
      responses:
        "200": {description: Desired state with monotonically increasing revision}
        "401": {description: Invalid connector credential}
        "404": {description: Desired state has not been published}
  /connector/v1/commercial-state:
    get:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Read tenant-bound website entitlement, design and service-cycle state
      description: >
        Partner identity is derived only from the connector credential.
        Response includes the active visual design profile, active entitlements,
        version/configuration, domain binding and 30-day cycle metadata. Design
        remains a visual-only state block and does not contain or rewrite CMS
        content, module state, billing or workflow mechanics. The response
        deliberately excludes module prices, raw invoices, payment data and
        unrestricted personal data. Partner websites remain independent
        applications using this connector contract instead of being reprogrammed
        by HIMATE.
      responses:
        "200": {description: Minimized tenant-bound commercial state}
        "401": {description: Invalid connector credential}
        "403": {description: Adapter disabled}
        "409": {description: Adapter missing or primary-domain binding mismatch}
  /connector/v1/metrics:
    post:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Synchronize approved partner metrics
      description: No partner database access is exposed; metrics cross the explicit Connector Protocol only.
      responses:
        "202": {description: Metric batch accepted}
        "401": {description: Invalid connector credential}
        "409": {description: Metric rejected by the Impact service}
  /api/v1/connectors/start22/mapping:
    get:
      tags: [Connector]
      summary: Read the Klavierhaus 38-module START-22 allowlist contract
      description: Returns the machine-readable module/dataset registry, approved fields, target services, cadence, HIMATE_7Y retention policy and safe AES-256-GCM/key-version metadata.
      responses:
        "200": {description: START-22 mapping registry}
  /api/v1/connectors/start22/summary:
    get:
      tags: [Connector]
      summary: START-22 connector operations summary
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string, enum: [STAGING, PRODUCTION]}}
      responses:
        "200": {description: Batch, record, coverage, routing, retention, reconciliation and at-rest encryption state}
  /api/v1/connectors/start22/records:
    get:
      tags: [Connector]
      summary: List retained START-22 connector records for a partner
      parameters:
        - {name: partner_id, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: Retained allowlisted data records decrypted only inside the Connector service boundary, with provenance, HIMATE_7Y and encryption metadata}
        "400": {description: partner_id is required}
  /api/v1/connectors/start22/retention:
    get:
      tags: [Connector]
      summary: Read START-22 retention summary for a partner
      parameters:
        - {name: partner_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Seven-year retention, legal-hold and privacy-delete summary}
    post:
      tags: [Connector]
      summary: Apply approval-grade START-22 retention action
      description: Supports SET_LEGAL_HOLD, PRIVACY_DELETE and PURGE_EXPIRED. Legal hold and privacy delete are synchronized to routed Impact observations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [SET_LEGAL_HOLD, PRIVACY_DELETE, PURGE_EXPIRED]}
                record_id: {type: integer, format: int64}
                legal_hold: {type: boolean}
      responses:
        "200": {description: Retention action completed}
        "409": {description: Legal hold or retention conflict}
        "502": {description: Downstream Impact retention synchronization failed}
  /connector/v1/data/batches:
    post:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Submit a signed Klavierhaus START-22 data batch
      description: >
        Partner/environment identity is derived from the connector credential.
        Requests require HMAC-SHA-512 integrity headers, a credential-scoped nonce,
        a five-minute timestamp window, approved dataset/field allowlists and
        SHA-512 item checksums. Accepted business payloads are retained using
        AES-256-GCM envelope encryption with per-record data keys and a
        versioned runtime master-key keyring. Maximum body size is 1 MiB and
        maximum batch size is 250 items.
      parameters:
        - {name: X-Himate-Timestamp, in: header, required: true, schema: {type: string, format: date-time}}
        - {name: X-Himate-Nonce, in: header, required: true, schema: {type: string}}
        - {name: X-Himate-Body-SHA512, in: header, required: true, schema: {type: string, minLength: 128, maxLength: 128}}
        - {name: X-Himate-Signature, in: header, required: true, schema: {type: string, minLength: 128, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol_version, source_system, source_version, batch_id, generated_at, items]
              properties:
                protocol_version: {type: string, const: "1.0"}
                source_system: {type: string, const: KLAVIERHAUS}
                source_version: {type: string}
                batch_id: {type: string}
                generated_at: {type: string, format: date-time}
                items:
                  type: array
                  minItems: 1
                  maxItems: 250
                  items:
                    type: object
                    required: [module_key, dataset_key, schema_version, period_start, period_end, aggregation, data, source_checksum, idempotency_key]
                    properties:
                      module_key: {type: string}
                      dataset_key: {type: string}
                      schema_version: {type: integer, const: 1}
                      period_start: {type: string, format: date}
                      period_end: {type: string, format: date}
                      aggregation: {type: string, enum: [SUM, LATEST, AVERAGE]}
                      data: {type: object}
                      source_checksum: {type: string, minLength: 128, maxLength: 128}
                      idempotency_key: {type: string}
      responses:
        "202": {description: Signed batch accepted and routed}
        "200": {description: Exact idempotent batch retry already processed}
        "400": {description: Protocol, schema, dataset or field validation failed}
        "401": {description: Credential, timestamp, body checksum or signature invalid}
        "409": {description: Replay or idempotency conflict}
        "413": {description: Payload exceeds 1 MiB}
  /connector/v1/reconcile:
    post:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Reconcile a signed Klavierhaus batch against HIMATE
      description: Uses per-dataset item counts and aggregate SHA-512 checksums to produce SYNCED or OUT_OF_SYNC state.
      parameters:
        - {name: X-Himate-Timestamp, in: header, required: true, schema: {type: string, format: date-time}}
        - {name: X-Himate-Nonce, in: header, required: true, schema: {type: string}}
        - {name: X-Himate-Body-SHA512, in: header, required: true, schema: {type: string, minLength: 128, maxLength: 128}}
        - {name: X-Himate-Signature, in: header, required: true, schema: {type: string, minLength: 128, maxLength: 128}}
      responses:
        "200": {description: Reconciliation is SYNCED}
        "400": {description: Invalid reconciliation contract}
        "401": {description: Invalid signed connector request}
        "409": {description: Reconciliation is OUT_OF_SYNC or replay detected}
  /api/v1/system-health:
    get:
      tags: [System Health]
      summary: Central microservice and partner health snapshot
      responses:
        "200": {description: Service health plus partner database, storage, hostname/runtime, connector sync, environment and provisioning status}
  /api/v1/backups:
    get:
      tags: [Backups]
      summary: List restore points
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Restore points
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/RestorePoint"}}
                  count: {type: integer}
    post:
      tags: [Backups]
      summary: Queue an encrypted offsite restore point
      description: >
        Captures the isolated partner database, media namespace and redacted
        configuration. A successful backup automatically queues a restore test.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id]
              properties:
                partner_id: {type: string}
      responses:
        "202":
          description: Restore point queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestorePoint"}
        "409": {description: Backup disabled or already queued/running}
  /api/v1/backups/summary:
    get:
      tags: [Backups]
      summary: Partner backup and recoverability summary
      responses:
        "200":
          description: Latest backup, restore-test, retention and provider state by partner
  /api/v1/backups/scheduler/run:
    post:
      tags: [Backups]
      summary: Run one due-policy scheduler pass
      description: >
        Executes the same due-policy logic as the background scheduler. Intended for
        authorized operations and deterministic recovery acceptance; it queues only
        partners whose enabled policy is due.
      responses:
        "200": {description: Scheduler pass result with queued count and ran_at timestamp}
  /api/v1/backups/policies/{partnerId}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Backups]
      summary: Read partner backup policy
      responses:
        "200":
          description: Backup policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupPolicy"}
    put:
      tags: [Backups]
      summary: Create or replace partner backup policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BackupPolicyUpdate"}
      responses:
        "200":
          description: Updated backup policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupPolicy"}
  /api/v1/backups/restore-points/{restorePointId}:
    parameters:
      - {name: restorePointId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Backups]
      summary: Read a restore point
      responses:
        "200":
          description: Restore-point metadata and manifest
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestorePoint"}
        "404": {description: Restore point not found}
  /api/v1/backups/restore-points/{restorePointId}/restore-test:
    parameters:
      - {name: restorePointId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Backups]
      summary: Queue an explicit restore test from the offsite copy
      responses:
        "202":
          description: Restore test queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestoreTest"}
        "409": {description: Restore point is not READY or a test is already pending}
  /api/v1/backups/restore-tests:
    get:
      tags: [Backups]
      summary: List restore tests
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: restore_point_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Restore tests
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/RestoreTest"}}
                  count: {type: integer}
  /api/v1/backups/restore-tests/{restoreTestId}:
    parameters:
      - {name: restoreTestId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Backups]
      summary: Read a restore test
      responses:
        "200":
          description: Restore-test result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RestoreTest"}
        "404": {description: Restore test not found}
  /api/v1/backups/prune:
    post:
      tags: [Backups]
      summary: Apply partner retention policy immediately
      parameters:
        - {name: partner_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Number of expired offsite restore points}

  /api/v1/impact/definitions:
    get:
      tags: [Impact]
      summary: List locale-resolved bilingual metric definitions
      responses:
        "200": {description: Metric definitions}
    post:
      tags: [Impact]
      summary: Create a bilingual metric definition
      responses:
        "201": {description: Metric definition created}
  /api/v1/impact/values:
    get:
      tags: [Impact]
      summary: List impact observations
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: metric_key, in: query, schema: {type: string}}
        - {name: period_start, in: query, schema: {type: string, format: date}}
        - {name: period_end, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        "200": {description: Impact observations}
    post:
      tags: [Impact]
      summary: Record an impact observation
      description: >
        Provenance is explicitly SYSTEM, MANUAL, PARTNER_DECLARED or
        VERIFIED_DOCUMENT. VERIFIED_DOCUMENT requires a real VERIFIED Evidence
        record whose partner and metric linkage match the observation.
      responses:
        "201": {description: Impact observation recorded}
  /api/v1/impact/baselines:
    get:
      tags: [Impact]
      summary: List explicit metric baselines
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: metric_key, in: query, schema: {type: string}}
      responses:
        "200": {description: Metric baselines}
    put:
      tags: [Impact]
      summary: Create or replace a metric baseline
      description: >
        Administrator-entered baselines use MANUAL provenance or VERIFIED_DOCUMENT
        when a verified Evidence record is supplied. Period and source reference
        remain persisted.
      responses:
        "200": {description: Baseline stored}
  /api/v1/impact/summary:
    get:
      tags: [Impact]
      summary: Aggregate global or partner impact metrics
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: period_start, in: query, schema: {type: string, format: date}}
        - {name: period_end, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Aggregated impact metrics for the optional overlap period}
  /api/v1/evidence:
    get:
      tags: [Evidence]
      summary: Search the Evidence Library
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: metric_key, in: query, schema: {type: string}}
        - {name: evidence_type, in: query, schema: {type: string}}
        - {name: verification_status, in: query, schema: {type: string}}
        - {name: report_id, in: query, schema: {type: string}}
        - {name: period_start, in: query, schema: {type: string, format: date}}
        - {name: period_end, in: query, schema: {type: string, format: date}}
        - {name: q, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200": {description: Evidence Library records}
    post:
      tags: [Evidence]
      summary: Create evidence
      description: >
        File-backed evidence uses multipart/form-data and is content-sniffed,
        size-limited, checksum-backed and stored through the central storage
        service. URL and partner-declaration evidence use JSON. URL evidence is
        referenced only and is never fetched by the service.
      responses:
        "201": {description: Evidence created}
        "400": {description: Invalid evidence metadata}
        "413": {description: File exceeds the evidence size limit}
        "415": {description: File content is not allowed for the evidence type}
  /api/v1/evidence/{evidenceId}:
    parameters:
      - {name: evidenceId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Evidence]
      summary: Read an Evidence record
      responses:
        "200": {description: Evidence metadata}
    patch:
      tags: [Evidence]
      summary: Change Evidence verification status
      responses:
        "200": {description: Evidence verification updated}
  /api/v1/evidence/{evidenceId}/download:
    parameters:
      - {name: evidenceId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Evidence]
      summary: Download the immutable file behind an Evidence record
      responses:
        "200": {description: Evidence file}
        "409": {description: Evidence record has no stored file}
        "410": {description: Evidence metadata exists but the stored object is missing}
  /api/v1/evidence/{evidenceId}/preview:
    parameters:
      - {name: evidenceId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Evidence]
      summary: Preview a file-backed Evidence object inline
      responses:
        "200": {description: Inline Evidence file}
        "410": {description: Broken Evidence object reference}
  /api/v1/evidence/{evidenceId}/integrity:
    parameters:
      - {name: evidenceId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Evidence]
      summary: Recompute the stored file checksum and size
      responses:
        "200": {description: Evidence bytes match recorded SHA-256 and size}
        "409": {description: Integrity mismatch or no file}
        "410": {description: Evidence object is missing}
  /api/v1/reports:
    get:
      tags: [Reports]
      summary: List generated and queued reports
      responses:
        "200": {description: Report jobs}
    post:
      tags: [Reports]
      summary: Queue a reproducible PDF report
      description: >
        Supported report types are PARTNER_IMPACT, MULTI_PARTNER and
        HIMATE_GLOBAL. A background job freezes period-authoritative metrics,
        data sources and Evidence references into a persistent snapshot before
        rendering PDF. Each report persists a template version and SHA-256
        snapshot reference.
      responses:
        "202": {description: Report job queued}
  /api/v1/reports/{reportId}:
    parameters:
      - {name: reportId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Reports]
      summary: Read report job status and frozen snapshot
      responses:
        "200": {description: Report job and snapshot}
  /api/v1/reports/{reportId}/download:
    parameters:
      - {name: reportId, in: path, required: true, schema: {type: string}}
    get:
      tags: [Reports]
      summary: Download a completed HIMATE PDF report
      responses:
        "200": {description: PDF report}
        "409": {description: Report is not ready}
  /api/v1/reports/{reportId}/regenerate:
    parameters:
      - {name: reportId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Reports]
      summary: Re-render the PDF from the already frozen snapshot
      responses:
        "200": {description: PDF regenerated without reading live metric data}
  /api/v1/cms/pages:
    get:
      tags: [CMS]
      summary: List CMS pages and workflow pointers
      responses:
        "200": {description: CMS pages}
    post:
      tags: [CMS]
      summary: Create a CMS page with its first immutable DRAFT version
      description: >
        The stable page key is separate from the versioned slug. Each page is
        explicitly scoped to en_US or hu_HU and the same page_key may exist once
        per locale. The versioned SEO payload supports page-specific keywords in
        addition to title, meta description, canonical and Open Graph metadata.
        Draft content is never exposed through public CMS routes.
      responses:
        "201": {description: CMS page and initial draft created}
        "400": {description: Content validation failed}
        "409": {description: Page key conflict}
  /api/v1/cms/pages/{pageId}:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    get:
      tags: [CMS]
      summary: Read admin CMS page including current draft, preview and published snapshots
      responses:
        "200": {description: CMS page detail}
  /api/v1/cms/pages/{pageId}/draft:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    put:
      tags: [CMS]
      summary: Save a new immutable DRAFT version
      description: Every content modification creates a new version and CMS audit event.
      responses:
        "200": {description: New draft version}
        "400": {description: Draft content validation failed}
  /api/v1/cms/pages/{pageId}/preview:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    post:
      tags: [CMS]
      summary: Promote the current draft to PREVIEW and issue a one-time raw preview token
      description: >
        The preview token is stored only as SHA-256 and is returned raw only by
        this operation. START-23.8 additionally returns preview_html_path for a
        private, noindex full-page HTML preview through Gateway.
      responses:
        "201": {description: Preview snapshot, one-time token, raw preview_path and full-page preview_html_path}
  /cms-preview/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
      - {name: token, in: query, required: true, schema: {type: string}}
    get:
      tags: [CMS Preview]
      security: []
      summary: Render a token-scoped CMS PREVIEW as full initial HTML
      responses:
        "200": {description: Private noindex HTML using the same SSR component renderer as public CMS pages}
        "404": {description: Preview/token not found}
  /api/v1/cms/pages/{pageId}/preview-token:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    post:
      tags: [CMS]
      summary: Rotate the current preview token
      responses:
        "200": {description: New one-time raw preview token}
        "409": {description: No preview exists}
  /api/v1/cms/pages/{pageId}/publish:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    post:
      tags: [CMS]
      summary: Publish the current fresh PREVIEW snapshot
      description: >
        Publishing fails if the draft changed after preview, if required SEO or
        visible-section content is incomplete, if referenced media is missing,
        or if the published slug/canonical conflicts with another page.
      responses:
        "201": {description: New immutable PUBLISHED version}
        "400": {description: Publish validation failed}
        "409": {description: Preview is stale/missing or SEO conflicts}
  /api/v1/cms/pages/{pageId}/rollback:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    post:
      tags: [CMS]
      summary: Restore a prior PUBLISHED snapshot as a new PUBLISHED version
      responses:
        "201": {description: Rollback version activated with rollback_of_version_id}
        "409": {description: Invalid rollback target}
  /api/v1/cms/pages/{pageId}/versions:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    get:
      tags: [CMS]
      summary: List immutable CMS version history
      responses:
        "200": {description: DRAFT, PREVIEW and PUBLISHED versions}
  /api/v1/cms/pages/{pageId}/audit:
    parameters:
      - {name: pageId, in: path, required: true, schema: {type: string}}
    get:
      tags: [CMS]
      summary: List CMS-local content and publishing audit events
      description: START-18 later provides the global cross-system audit layer.
      responses:
        "200": {description: CMS audit events}
  /api/v1/cms/media:
    get:
      tags: [CMS]
      summary: List CMS media assets
      responses:
        "200": {description: CMS media assets}
    post:
      tags: [CMS]
      summary: Upload a CMS image asset
      description: >
        Media is limited to PNG/JPEG/WebP/MP4/WebM, content-sniffed, max 64 MiB,
        checksum-backed and persisted through the central Storage service.
      responses:
        "201": {description: Stable CMS media asset}
        "413": {description: Media request or file exceeds the size limit}
        "415": {description: Media content type is not allowed}
  /api/v1/cms/media/{mediaId}/preview:
    parameters:
      - {name: mediaId, in: path, required: true, schema: {type: string}}
    get:
      tags: [CMS]
      summary: Preview an authenticated CMS media asset
      responses:
        "200": {description: Inline media bytes}
  /api/v1/cms/seo:
    get:
      tags: [CMS]
      summary: Read editable and published global SEO & Keywords settings
      responses:
        "200": {description: Draft/published bilingual keyword and structured-SEO settings}
  /api/v1/cms/seo/draft:
    put:
      tags: [CMS]
      summary: Save an auditable global SEO & Keywords draft
      description: >
        Stores English and Hungarian global keywords, Schema.org organization
        defaults and an optional default Open Graph image.
      responses:
        "200": {description: SEO settings draft saved}
        "400": {description: SEO settings validation failed}
  /api/v1/cms/seo/publish:
    post:
      tags: [CMS]
      summary: Publish the current global SEO & Keywords draft
      responses:
        "200": {description: Published SEO settings version}
        "400": {description: SEO settings validation failed}
  /api/v1/cms/seo/audit:
    get:
      tags: [CMS]
      summary: Analyze CMS drafts for SEO completeness and keyword/content fit
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [en_US, hu_HU]}}
      responses:
        "200": {description: Per-page score, issues, effective keywords and keyword suggestions}
  /public/v1/cms/seo:
    get:
      tags: [CMS Public]
      security: []
      summary: Read active published SEO defaults for one language
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [en_US, hu_HU], default: en_US}}
      responses:
        "200": {description: Published global keywords, Schema.org organization defaults and Open Graph image}
  /api/v1/cms/design:
    get:
      tags: [CMS]
      summary: Read the editable and published global website Design Guide
      responses:
        "200": {description: Draft/published design settings, version and timestamps}
  /api/v1/cms/design/draft:
    put:
      tags: [CMS]
      summary: Save an auditable Design Guide draft
      description: >
        Controls the public logo media asset, brand colors, heading/body fonts,
        button radius and ordered bilingual navigation without source-code edits.
      responses:
        "200": {description: Design Guide draft saved}
        "400": {description: Design validation failed}
  /api/v1/cms/design/preview:
    post:
      tags: [CMS]
      summary: Issue a 30-minute token for a full-site Design Guide preview
      description: >
        The raw token is returned only by this operation and only its SHA-256
        hash is stored. The response includes desktop, tablet and mobile preview
        paths rendered by Gateway.
      responses:
        "201": {description: Token plus 1440/834/390 full-site preview paths}
        "400": {description: Current design draft is invalid}
  /api/v1/cms/design/publish:
    post:
      tags: [CMS]
      summary: Publish the current Design Guide draft
      responses:
        "200": {description: Published design version}
        "400": {description: Design validation failed}
  /public/v1/cms/design:
    get:
      tags: [CMS Public]
      security: []
      summary: Read the active published global website Design Guide
      responses:
        "200": {description: Published logo, color, typography, button and bilingual navigation settings}
  /preview/v1/cms/design:
    get:
      tags: [CMS Preview]
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}}
      summary: Read the token-scoped Design Guide draft for full-site preview rendering
      responses:
        "200": {description: Private draft Design Guide}
        "404": {description: Preview token missing, invalid or expired}
  /preview/v1/cms/design/media/{mediaId}:
    parameters:
      - {name: mediaId, in: path, required: true, schema: {type: string}}
      - {name: token, in: query, required: true, schema: {type: string}}
    get:
      tags: [CMS Preview]
      security: []
      summary: Serve only the draft logo media selected by the token-scoped Design preview
      responses:
        "200": {description: Private draft logo bytes}
        "404": {description: Token invalid or media is not the draft logo}
  /design-preview:
    get:
      tags: [CMS Preview]
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}}
        - {name: viewport, in: query, schema: {type: string, enum: [desktop, tablet, mobile], default: desktop}}
        - {name: raw, in: query, schema: {type: string, enum: ["0", "1"], default: "0"}}
      summary: Render the real landing website with the token-scoped draft Design Guide
      responses:
        "200": {description: Desktop/tablet/mobile preview wrapper or raw full website HTML}
        "404": {description: Design preview token invalid or expired}
  /public/v1/cms/partner-design/{partnerId}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [CMS Public]
      security: []
      summary: Resolve the active visual theme for a partner website/runtime
      description: >
        Returns the active catalog/custom profile and visual tokens independently
        from CMS content and business APIs, enabling theme swaps without content migration.
      responses:
        "200": {description: Active partner design profile and effective visual theme}
        "404": {description: Partner design scope not found}
  /public/v1/cms/pages/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
      - {name: locale, in: query, schema: {type: string, enum: [en_US, hu_HU], default: en_US}}
    get:
      tags: [CMS Public]
      security: []
      summary: Read only the active PUBLISHED CMS page
      description: Hidden sections and all draft/preview snapshots are excluded.
      responses:
        "200": {description: Published content model with effective keywords, Schema.org JSON-LD and bilingual canonical alternates}
        "404": {description: No published page exists for this slug}
  /preview/v1/cms/pages/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
      - {name: token, in: query, required: true, schema: {type: string}}
    get:
      tags: [CMS Preview]
      security: []
      summary: Read the active PREVIEW snapshot using its scoped preview token
      responses:
        "200": {description: Preview content using the same public content model}
        "404": {description: Preview/token not found}
  /public/v1/cms/media/{mediaId}:
    parameters:
      - {name: mediaId, in: path, required: true, schema: {type: string}}
    get:
      tags: [CMS Public]
      security: []
      summary: Serve media only when referenced by an active PUBLISHED page
      responses:
        "200": {description: Published media}
        "404": {description: Media is not referenced by published content}
  /preview/v1/cms/media/{mediaId}:
    parameters:
      - {name: mediaId, in: path, required: true, schema: {type: string}}
      - {name: slug, in: query, required: true, schema: {type: string}}
      - {name: token, in: query, required: true, schema: {type: string}}
    get:
      tags: [CMS Preview]
      security: []
      summary: Serve media only when referenced by the slug/token-scoped PREVIEW page
      responses:
        "200": {description: Preview media}
        "404": {description: Media/token/page relationship not found}
  /public/v1/cms/manifest:
    get:
      tags: [CMS Public]
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [en_US, hu_HU], default: en_US}}
      security: []
      summary: Published SEO manifest for sitemap/robots preparation
      responses:
        "200": {description: Published slug, canonical, title, noindex and version metadata}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: himate_session
    connectorBearer:
      type: http
      scheme: bearer
      bearerFormat: HIMATE Connector Credential
  parameters:
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ptr_[0-9]{6}$"
  schemas:
    BackupPolicy:
      type: object
      properties:
        partner_id: {type: string}
        retention_days: {type: integer, minimum: 1, maximum: 3650}
        max_restore_points: {type: integer, minimum: 1, maximum: 365}
        schedule_hours: {type: integer, minimum: 1, maximum: 720}
        enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
    BackupPolicyUpdate:
      type: object
      required: [retention_days, max_restore_points, schedule_hours, enabled]
      properties:
        retention_days: {type: integer, minimum: 1, maximum: 3650}
        max_restore_points: {type: integer, minimum: 1, maximum: 365}
        schedule_hours: {type: integer, minimum: 1, maximum: 720}
        enabled: {type: boolean}
    RestorePoint:
      type: object
      properties:
        id: {type: string}
        partner_id: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED]}
        provider: {type: string, enum: [local, s3]}
        object_key: {type: string}
        ciphertext_sha256: {type: string}
        ciphertext_bytes: {type: integer, format: int64}
        manifest: {type: object, additionalProperties: true}
        created_by: {type: string}
        error: {type: string}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
    RestoreTest:
      type: object
      properties:
        id: {type: string}
        restore_point_id: {type: string}
        partner_id: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING, PASSED, FAILED]}
        database_ok: {type: boolean}
        media_ok: {type: boolean}
        config_ok: {type: boolean}
        error: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        duration_ms: {type: integer, format: int64}
    NewPartner:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string, minLength: 1, description: Presentation name; duplicate display names are allowed}
        legal_name: {type: string}
        brand_name: {type: string}
        category_id: {type: string}
        lifecycle:
          type: string
          const: PROSPECT
        primary_domain: {type: string}
        contact_name: {type: string}
        contact_email: {type: string, format: email}
        finance_contact_name: {type: string}
        finance_contact_email: {type: string, format: email}
        technical_contact_name: {type: string}
        technical_contact_email: {type: string, format: email}
        marketing_contact_name: {type: string}
        marketing_contact_email: {type: string, format: email}
        registration_number: {type: string}
        tax_id: {type: string}
        country: {type: string}
        state_region: {type: string}
        city: {type: string}
        postal_code: {type: string}
        address_line1: {type: string}
        address_line2: {type: string}
        website: {type: string}
        phone: {type: string}
        notes: {type: string}
        onboarding_request_id:
          type: string
          maxLength: 160
          description: Stable client-generated idempotency key for one New Partner onboarding attempt
    Partner:
      type: object
      properties:
        id: {type: string}
        display_name: {type: string}
        legal_name: {type: string}
        brand_name: {type: string}
        category_id: {type: string}
        category_name: {type: string}
        lifecycle:
          type: string
          enum: [PROSPECT, LICENSE_PENDING, READY_TO_PROVISION, PROVISIONING, CONFIGURATION, TESTING, READY_FOR_LAUNCH, LIVE, SUSPENDED, ARCHIVED]
        registration_number: {type: string}
        tax_id: {type: string}
        country: {type: string}
        state_region: {type: string}
        city: {type: string}
        postal_code: {type: string}
        address_line1: {type: string}
        address_line2: {type: string}
        website: {type: string}
        phone: {type: string}
        contact_name: {type: string}
        contact_email: {type: string}
        finance_contact_name: {type: string}
        finance_contact_email: {type: string}
        technical_contact_name: {type: string}
        technical_contact_email: {type: string}
        marketing_contact_name: {type: string}
        marketing_contact_email: {type: string}
        primary_domain: {type: string}
        staging_domain: {type: string}
        logo_url: {type: string}
        notes: {type: string}
        platform_version: {type: string}
        system_health: {type: string}
        health_checked_at: {type: [string, "null"], format: date-time}
        last_sync_at: {type: [string, "null"], format: date-time}
        active_modules: {type: integer}
        service_value_30d: {type: number}
        test_partner:
          type: boolean
          description: Golden test tenant marker. Test data remains partner-visible but is excluded from platform business aggregates.
    PartnerUpdate:
      type: object
      properties:
        display_name: {type: string}
        legal_name: {type: string}
        brand_name: {type: string}
        registration_number: {type: string}
        tax_id: {type: string}
        lifecycle:
          type: string
          enum: [PROSPECT, LICENSE_PENDING, READY_TO_PROVISION, PROVISIONING, CONFIGURATION, TESTING, READY_FOR_LAUNCH, LIVE, SUSPENDED, ARCHIVED]
        reason: {type: string}
        primary_domain: {type: string}
        staging_domain: {type: string}
        contact_name: {type: string}
        contact_email: {type: string}
        finance_contact_name: {type: string}
        finance_contact_email: {type: string}
        technical_contact_name: {type: string}
        technical_contact_email: {type: string}
        marketing_contact_name: {type: string}
        marketing_contact_email: {type: string}
        country: {type: string}
        state_region: {type: string}
        city: {type: string}
        postal_code: {type: string}
        address_line1: {type: string}
        address_line2: {type: string}
        website: {type: string}
        phone: {type: string}
        logo_url: {type: string}
        notes: {type: string}
        test_partner:
          type: boolean
          description: HIMATE admin-only Golden Test Partner flag. Enabling it activates the LIVE test tenant and its full canonical module entitlement set.
security:
  - sessionCookie: []
