openapi: 3.1.0
info:
  title: HIMATE Control Plane API
  version: 0.4.0-start-09-13
  description: >
    Authenticated REST contract for the START-01 through START-13 HIMATE
    control-plane surface. Partner business databases remain isolated behind
    connector/API contracts; provisioning never copies partner business data.
servers:
  - url: /
tags:
  - name: Health
  - name: Authentication
  - name: Partners
  - name: Modules
  - name: Billing
  - name: Provisioning
  - name: Environments
  - name: Connector
  - name: System Health
  - name: Impact
  - name: Public
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Gateway and microservice health
      responses:
        "200":
          description: Health snapshot with checked_at timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  architecture: {type: string}
                  checked_at: {type: string, format: date-time}
                  services:
                    type: object
                    additionalProperties: {type: string}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Administrator sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        "200": {description: Authenticated administrator}
        "401": {description: Invalid credentials}
        "429": {description: Sign-in rate limit exceeded}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End administrator session
      responses:
        "204": {description: Session ended}
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Current administrator
      responses:
        "200": {description: Current administrator}
        "401": {description: Authentication required}
  /api/v1/dashboard/summary:
    get:
      tags: [Health]
      summary: Cached executive summary
      responses:
        "200": {description: Dashboard KPI snapshot}
  /api/v1/partner-categories:
    get:
      tags: [Partners]
      summary: List partner categories
      responses:
        "200": {description: Partner categories}
    post:
      tags: [Partners]
      summary: Create a partner category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201": {description: Category created}
        "409": {description: Category already exists}
  /api/v1/partners:
    get:
      tags: [Partners]
      summary: Paginated partner portfolio
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: q, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: lifecycle, in: query, schema: {type: string}}
        - {name: health, in: query, schema: {type: string, enum: [ALL, HEALTHY, WARNING, OFFLINE, UNKNOWN]}}
        - {name: include_archived, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Partner portfolio with aggregate card data
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Partner"}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  has_more: {type: boolean}
                  lifecycle_counts:
                    type: object
                    additionalProperties: {type: integer}
    post:
      tags: [Partners]
      summary: Create a PROSPECT partner record
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewPartner"}
      responses:
        "201": {description: Partner created}
        "409": {description: Duplicate slug or domain}
  /api/v1/partners/{partnerId}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Partners]
      summary: Partner record
      responses:
        "200": {description: Partner}
        "404": {description: Partner not found}
    patch:
      tags: [Partners]
      summary: Update partner company data or lifecycle
      description: >
        Lifecycle transitions are backend-enforced and historized. Entering
        PROVISIONING fails closed unless Billing confirms the authoritative
        initial-license payment/evidence gate (or an explicit valid waiver).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartnerUpdate"}
      responses:
        "200": {description: Updated partner}
        "409": {description: Invalid lifecycle transition or uniqueness conflict}
  /api/v1/module-groups:
    get:
      tags: [Modules]
      summary: Module categories
      responses:
        "200": {description: Module categories}
  /api/v1/modules:
    get:
      tags: [Modules]
      summary: Module catalog
      responses:
        "200": {description: Canonical and custom modules}
    post:
      tags: [Modules]
      summary: Create custom module
      responses:
        "201": {description: Module created}
        "409": {description: Stable key conflict}
  /api/v1/modules/{moduleKey}:
    parameters:
      - name: moduleKey
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Modules]
      summary: Update catalog metadata or availability
      responses:
        "200": {description: Updated catalog module}
  /api/v1/partners/{partnerId}/modules:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Modules]
      summary: Partner module entitlements and effective prices
      responses:
        "200": {description: Partner modules}
  /api/v1/partners/{partnerId}/modules/{moduleKey}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
      - name: moduleKey
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Modules]
      summary: Update partner module state, visibility, package inclusion or price
      description: >
        Pricing accepts an optional RFC3339 price_effective_at. Historical
        changes retain actor, reason, old value and new value.
      responses:
        "200": {description: Updated partner module}
  /api/v1/billing/profile:
    get:
      tags: [Billing]
      summary: HIMATE issuer and banking profile
      responses:
        "200": {description: Billing profile}
    put:
      tags: [Billing]
      summary: Update HIMATE issuer and banking profile
      responses:
        "200": {description: Updated billing profile}
  /api/v1/billing/partners/{partnerId}/terms:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Partner commercial terms
      responses:
        "200": {description: Commercial terms}
    put:
      tags: [Billing]
      summary: Update partner commercial terms
      description: >
        Records base-fee history and the activation-date anchor for the 30-day
        service cycle.
      responses:
        "200": {description: Updated terms}
  /api/v1/billing/partners/{partnerId}/license:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Initial license state
      responses:
        "200": {description: Initial license}
    put:
      tags: [Billing]
      summary: Update initial license payment state
      description: >
        PAID requires payment date, reference, verifier and registered
        commercial evidence.
      responses:
        "200": {description: Updated initial license}
        "409": {description: License evidence required}
  /api/v1/billing/partners/{partnerId}/summary:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Current 30-day commercial summary
      responses:
        "200": {description: Effective fee and cycle window}
  /api/v1/billing/partners/{partnerId}/documents:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Commercial document metadata
      responses:
        "200": {description: Documents}
    post:
      tags: [Billing]
      summary: Register commercial document metadata
      description: >
        Commercial evidence types (CONTRACT, INVOICE, RECEIPT and
        PAYMENT_EVIDENCE) require a non-empty persistent storage URL or
        document reference before they can satisfy the initial-license gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind:
                  type: string
                  enum: [CONTRACT, INVOICE, RECEIPT, PAYMENT_EVIDENCE, OTHER]
                name: {type: string}
                storage_url: {type: string, maxLength: 2048}
                note: {type: string}
                verified_by: {type: string}
                mime_type: {type: string}
                sha256: {type: string}
                size_bytes: {type: integer, minimum: 0}
      responses:
        "201": {description: Document registered}
        "400": {description: Validation failed or evidence reference missing}
  /api/v1/billing/partners/{partnerId}/invoices:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Internal invoice records
      responses:
        "200": {description: Invoices}
  /api/v1/billing/partners/{partnerId}/subscriptions:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Billing]
      summary: Module subscription snapshots
      responses:
        "200": {description: Subscription records}
  /api/v1/billing/partners/{partnerId}/subscriptions/{moduleKey}:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
      - name: moduleKey
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Billing]
      summary: Schedule or withdraw end-of-period cancellation
      description: Cancellation preserves the current 30-day period and prevents the next renewal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancel_at_period_end]
              properties:
                cancel_at_period_end: {type: boolean}
                reason: {type: string}
      responses:
        "200": {description: Subscription updated}
        "404": {description: Subscription not found}
        "409": {description: Inactive subscription must be reactivated at module level}
  /api/v1/public/contact:
    post:
      tags: [Public]
      security: []
      summary: Public contact inquiry
      responses:
        "201": {description: Inquiry accepted}
        "429": {description: Rate limited}
  /api/v1/provisioning/jobs:
    get:
      tags: [Provisioning]
      summary: List provisioning jobs
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
      responses:
        "200": {description: Provisioning jobs}
    post:
      tags: [Provisioning]
      summary: Prepare, start or resume idempotent partner provisioning
      description: >
        With prepare_only=true the complete provisioning plan is persisted before
        the commercial gate without allocating partner infrastructure. Execution
        requires READY_TO_PROVISION/PROVISIONING/CONFIGURATION and a satisfied
        initial-license gate. The workflow creates isolated database/role and
        storage, applies the structure-only template and module preset, publishes
        connector desired state, deploys staging and verifies database, storage and
        runtime health. Successful steps are not repeated on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id]
              properties:
                partner_id: {type: string}
                system_name: {type: string}
                admin_email: {type: string, format: email}
                platform_version: {type: string}
                desired_release: {type: string}
                environment: {type: string, enum: [STAGING], default: STAGING}
                prepare_only: {type: boolean, default: false}
                module_preset:
                  type: array
                  items: {type: string}
      responses:
        "202": {description: Provisioning completed to configuration-required state}
        "409": {description: License/lifecycle/dependency gate blocked or workflow incomplete}
  /api/v1/provisioning/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Provisioning]
      summary: Provisioning job and step history
      responses:
        "200": {description: Provisioning job}
  /api/v1/provisioning/jobs/{jobId}/run:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Provisioning]
      summary: Resume an incomplete provisioning job
      responses:
        "200": {description: Job resumed/completed}
        "409": {description: Job still blocked or failed}
  /api/v1/environments:
    get:
      tags: [Environments]
      summary: List partner staging/production environments
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
      responses:
        "200": {description: Partner environments}
    post:
      tags: [Environments]
      summary: Register a staging or production environment
      responses:
        "201": {description: Environment created}
        "409": {description: Duplicate environment or hostname}
  /api/v1/environments/{environmentId}:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Environments]
      summary: Update environment hostname, release and deployment state
      responses:
        "200": {description: Updated environment}
  /api/v1/connectors/{partnerId}/credential:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Connector]
      summary: Connector credential metadata
      description: Raw credentials are never returned by GET.
      responses:
        "200": {description: Credential metadata}
    post:
      tags: [Connector]
      summary: Create or rotate a partner/environment connector credential
      description: The raw bearer token is returned once; HIMATE stores only its hash.
      responses:
        "201": {description: One-time raw token and credential metadata}
  /api/v1/connectors/{partnerId}/desired-state:
    parameters:
      - {$ref: "#/components/parameters/PartnerId"}
    get:
      tags: [Connector]
      summary: Read the desired partner state for an environment
      parameters:
        - {name: environment, in: query, schema: {type: string, enum: [STAGING, PRODUCTION], default: STAGING}}
      responses:
        "200": {description: Versioned entitlement, maintenance and configuration desired state}
    put:
      tags: [Connector]
      summary: Replace the desired partner state for an environment
      responses:
        "200": {description: Updated desired state and revision}
  /connector/v1/heartbeat:
    post:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Partner connector heartbeat and version/module state
      responses:
        "200": {description: Heartbeat accepted}
        "401": {description: Invalid connector credential}
  /connector/v1/state:
    get:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Read connector state for the authenticated partner/environment
      responses:
        "200": {description: Connector state}
  /connector/v1/desired-state:
    get:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Fetch entitlement, maintenance and configuration desired state for the authenticated partner/environment
      responses:
        "200": {description: Desired state with monotonically increasing revision}
        "401": {description: Invalid connector credential}
        "404": {description: Desired state has not been published}
  /connector/v1/metrics:
    post:
      tags: [Connector]
      security:
        - connectorBearer: []
      summary: Synchronize approved partner metrics
      description: No partner database access is exposed; metrics cross the explicit Connector Protocol only.
      responses:
        "202": {description: Metric batch accepted}
        "401": {description: Invalid connector credential}
        "409": {description: Metric rejected by the Impact service}
  /api/v1/system-health:
    get:
      tags: [System Health]
      summary: Central microservice and partner health snapshot
      responses:
        "200": {description: Service health plus partner database, storage, hostname/runtime, connector sync, environment and provisioning status}
  /api/v1/impact/definitions:
    get:
      tags: [Impact]
      summary: List metric definitions
      responses:
        "200": {description: Metric definitions}
    post:
      tags: [Impact]
      summary: Create a metric definition
      responses:
        "201": {description: Metric definition created}
  /api/v1/impact/values:
    get:
      tags: [Impact]
      summary: List impact observations
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: metric_key, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        "200": {description: Impact observations}
    post:
      tags: [Impact]
      summary: Record an impact observation
      description: >
        Provenance is explicitly SYSTEM, MANUAL, PARTNER_DECLARED or
        VERIFIED_DOCUMENT. Evidence file management begins in START-14.
      responses:
        "201": {description: Impact observation recorded}
  /api/v1/impact/baselines:
    get:
      tags: [Impact]
      summary: List explicit metric baselines
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
        - {name: metric_key, in: query, schema: {type: string}}
      responses:
        "200": {description: Metric baselines}
    put:
      tags: [Impact]
      summary: Create or replace a metric baseline
      description: Administrator-entered baselines use MANUAL provenance and retain period and source reference.
      responses:
        "200": {description: Baseline stored}
  /api/v1/impact/summary:
    get:
      tags: [Impact]
      summary: Aggregate global or partner impact metrics
      parameters:
        - {name: partner_id, in: query, schema: {type: string}}
      responses:
        "200": {description: Aggregated impact metrics}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: himate_session
    connectorBearer:
      type: http
      scheme: bearer
      bearerFormat: HIMATE Connector Credential
  parameters:
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ptr_[0-9]{6}$"
  schemas:
    NewPartner:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string}
        legal_name: {type: string}
        brand_name: {type: string}
        category_id: {type: string}
        lifecycle:
          type: string
          const: PROSPECT
        primary_domain: {type: string}
        contact_name: {type: string}
        contact_email: {type: string, format: email}
        country: {type: string}
    Partner:
      type: object
      properties:
        id: {type: string}
        display_name: {type: string}
        legal_name: {type: string}
        brand_name: {type: string}
        lifecycle:
          type: string
          enum: [PROSPECT, LICENSE_PENDING, READY_TO_PROVISION, PROVISIONING, CONFIGURATION, TESTING, READY_FOR_LAUNCH, LIVE, SUSPENDED, ARCHIVED]
        primary_domain: {type: string}
        staging_domain: {type: string}
        platform_version: {type: string}
        system_health: {type: string}
        health_checked_at: {type: [string, "null"], format: date-time}
        last_sync_at: {type: [string, "null"], format: date-time}
        active_modules: {type: integer}
        service_value_30d: {type: number}
    PartnerUpdate:
      type: object
      properties:
        display_name: {type: string}
        legal_name: {type: string}
        brand_name: {type: string}
        registration_number: {type: string}
        tax_id: {type: string}
        lifecycle:
          type: string
          enum: [PROSPECT, LICENSE_PENDING, READY_TO_PROVISION, PROVISIONING, CONFIGURATION, TESTING, READY_FOR_LAUNCH, LIVE, SUSPENDED, ARCHIVED]
        reason: {type: string}
        primary_domain: {type: string}
        staging_domain: {type: string}
        contact_name: {type: string}
        contact_email: {type: string}
        finance_contact_name: {type: string}
        finance_contact_email: {type: string}
        technical_contact_name: {type: string}
        technical_contact_email: {type: string}
        marketing_contact_name: {type: string}
        marketing_contact_email: {type: string}
        country: {type: string}
        state_region: {type: string}
        city: {type: string}
        postal_code: {type: string}
        address_line1: {type: string}
        address_line2: {type: string}
        website: {type: string}
        phone: {type: string}
        logo_url: {type: string}
        notes: {type: string}
security:
  - sessionCookie: []
