databases:
  - name: himate-db
    databaseName: himate
    user: himate

services:
  - type: pserv
    name: himate-catalog
    runtime: docker
    dockerfilePath: ./services/docker/catalog.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        generateValue: true

  - type: pserv
    name: himate-partners
    runtime: docker
    dockerfilePath: ./services/docker/partners.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: BILLING_HOSTPORT
        fromService:
          type: pserv
          name: himate-billing
          property: hostport

  - type: pserv
    name: himate-billing
    runtime: docker
    dockerfilePath: ./services/docker/billing.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: CATALOG_HOSTPORT
        fromService:
          type: pserv
          name: himate-catalog
          property: hostport
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport
      - key: PAYMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-payments
          property: hostport

  - type: pserv
    name: himate-payments
    runtime: docker
    dockerfilePath: ./services/docker/payments.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: BILLING_HOSTPORT
        fromService:
          type: pserv
          name: himate-billing
          property: hostport
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_API_BASE
        value: https://api.stripe.com

  - type: pserv
    name: himate-contact
    runtime: docker
    dockerfilePath: ./services/docker/contact.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: HIMATE_CONTACT_NOTIFY_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: pserv
    name: himate-storage
    runtime: docker
    dockerfilePath: ./services/docker/storage.Dockerfile
    dockerContext: .
    autoDeploy: false
    disk:
      name: himate-partner-storage
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: HIMATE_STORAGE_ROOT
        value: /data/partners

  - type: pserv
    name: himate-backups
    runtime: docker
    dockerfilePath: ./services/docker/backups.Dockerfile
    dockerContext: .
    autoDeploy: false
    disk:
      name: himate-backups-offsite
      mountPath: /offsite
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: PARTNER_DATABASE_ADMIN_URL
        sync: false
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: HIMATE_BACKUP_ENCRYPTION_KEY_B64
        sync: false
      - key: HIMATE_BACKUP_PROVIDER
        value: render_disk
      - key: HIMATE_BACKUP_OFFSITE_ROOT
        value: /offsite
      - key: HIMATE_BACKUP_WORKERS
        value: "2"
      - key: STORAGE_HOSTPORT
        fromService:
          type: pserv
          name: himate-storage
          property: hostport
      - key: ENVIRONMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-environments
          property: hostport
      - key: CONNECTOR_HOSTPORT
        fromService:
          type: pserv
          name: himate-connector
          property: hostport
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport

  - type: pserv
    name: himate-runtime
    runtime: docker
    dockerfilePath: ./services/docker/runtime.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: HIMATE_RUNTIME_PROVIDER
        value: render
      - key: RENDER_API_BASE
        value: https://api.render.com/v1
      - key: RENDER_API_KEY
        sync: false
      - key: HIMATE_RENDER_SERVICE_ID
        sync: false

  - type: pserv
    name: himate-evidence
    runtime: docker
    dockerfilePath: ./services/docker/evidence.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: STORAGE_HOSTPORT
        fromService:
          type: pserv
          name: himate-storage
          property: hostport

  - type: pserv
    name: himate-impact
    runtime: docker
    dockerfilePath: ./services/docker/impact.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: EVIDENCE_HOSTPORT
        fromService:
          type: pserv
          name: himate-evidence
          property: hostport

  - type: pserv
    name: himate-reports
    runtime: docker
    dockerfilePath: ./services/docker/reports.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: IMPACT_HOSTPORT
        fromService:
          type: pserv
          name: himate-impact
          property: hostport
      - key: EVIDENCE_HOSTPORT
        fromService:
          type: pserv
          name: himate-evidence
          property: hostport
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport
      - key: STORAGE_HOSTPORT
        fromService:
          type: pserv
          name: himate-storage
          property: hostport

  - type: pserv
    name: himate-cms
    runtime: docker
    dockerfilePath: ./services/docker/cms.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: STORAGE_HOSTPORT
        fromService:
          type: pserv
          name: himate-storage
          property: hostport

  - type: pserv
    name: himate-environments
    runtime: docker
    dockerfilePath: ./services/docker/environments.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: PARTNER_RUNTIME_HOSTPORT
        fromService:
          type: pserv
          name: himate-runtime
          property: hostport
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport

  - type: pserv
    name: himate-connector
    runtime: docker
    dockerfilePath: ./services/docker/connector.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: HIMATE_CONNECTOR_DATA_MASTER_KEY_B64
        sync: false
      - key: HIMATE_CONNECTOR_DATA_KEY_VERSION
        value: v1
      - key: IMPACT_HOSTPORT
        fromService:
          type: pserv
          name: himate-impact
          property: hostport
      - key: CATALOG_HOSTPORT
        fromService:
          type: pserv
          name: himate-catalog
          property: hostport
      - key: BILLING_HOSTPORT
        fromService:
          type: pserv
          name: himate-billing
          property: hostport
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport

  - type: pserv
    name: himate-provisioning
    runtime: docker
    dockerfilePath: ./services/docker/provisioning.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: PARTNER_DATABASE_ADMIN_URL
        sync: false
      - key: PARTNER_DATABASE_MASTER_SECRET
        generateValue: true
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport
      - key: BILLING_HOSTPORT
        fromService:
          type: pserv
          name: himate-billing
          property: hostport
      - key: CATALOG_HOSTPORT
        fromService:
          type: pserv
          name: himate-catalog
          property: hostport
      - key: ENVIRONMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-environments
          property: hostport
      - key: CONNECTOR_HOSTPORT
        fromService:
          type: pserv
          name: himate-connector
          property: hostport
      - key: STORAGE_HOSTPORT
        fromService:
          type: pserv
          name: himate-storage
          property: hostport

  - type: pserv
    name: himate-notifications
    runtime: docker
    dockerfilePath: ./services/docker/notifications.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN

  - type: pserv
    name: himate-health
    runtime: docker
    dockerfilePath: ./services/docker/health.Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport
      - key: CATALOG_HOSTPORT
        fromService:
          type: pserv
          name: himate-catalog
          property: hostport
      - key: BILLING_HOSTPORT
        fromService:
          type: pserv
          name: himate-billing
          property: hostport
      - key: PAYMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-payments
          property: hostport
      - key: CONTACT_HOSTPORT
        fromService:
          type: pserv
          name: himate-contact
          property: hostport
      - key: PROVISIONING_HOSTPORT
        fromService:
          type: pserv
          name: himate-provisioning
          property: hostport
      - key: ENVIRONMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-environments
          property: hostport
      - key: CONNECTOR_HOSTPORT
        fromService:
          type: pserv
          name: himate-connector
          property: hostport
      - key: IMPACT_HOSTPORT
        fromService:
          type: pserv
          name: himate-impact
          property: hostport
      - key: EVIDENCE_HOSTPORT
        fromService:
          type: pserv
          name: himate-evidence
          property: hostport
      - key: REPORTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-reports
          property: hostport
      - key: CMS_HOSTPORT
        fromService:
          type: pserv
          name: himate-cms
          property: hostport
      - key: STORAGE_HOSTPORT
        fromService:
          type: pserv
          name: himate-storage
          property: hostport
      - key: PARTNER_RUNTIME_HOSTPORT
        fromService:
          type: pserv
          name: himate-runtime
          property: hostport
      - key: NOTIFICATIONS_HOSTPORT
        fromService:
          type: pserv
          name: himate-notifications
          property: hostport
      - key: BACKUPS_HOSTPORT
        fromService:
          type: pserv
          name: himate-backups
          property: hostport

  - type: web
    name: himate
    runtime: docker
    dockerfilePath: ./services/docker/gateway.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/live
    renderSubdomainPolicy: enabled
    autoDeploy: false
    envVars:
      - key: HIMATE_ENV
        value: production
      - key: HIMATE_APP_VERSION
        value: 0.8.10-start-23.6
      - key: COOKIE_SECURE
        value: "true"
      - key: HIMATE_SESSION_TTL_HOURS
        value: "8"
      - key: HIMATE_PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: HIMATE_PASSWORD_RESET_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: HIMATE_SESSION_SECRET
        generateValue: true
      - key: HIMATE_BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: HIMATE_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: HIMATE_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: PARTNERS_HOSTPORT
        fromService:
          type: pserv
          name: himate-partners
          property: hostport
      - key: CATALOG_HOSTPORT
        fromService:
          type: pserv
          name: himate-catalog
          property: hostport
      - key: BILLING_HOSTPORT
        fromService:
          type: pserv
          name: himate-billing
          property: hostport
      - key: PAYMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-payments
          property: hostport
      - key: CONTACT_HOSTPORT
        fromService:
          type: pserv
          name: himate-contact
          property: hostport
      - key: PROVISIONING_HOSTPORT
        fromService:
          type: pserv
          name: himate-provisioning
          property: hostport
      - key: ENVIRONMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-environments
          property: hostport
      - key: CONNECTOR_HOSTPORT
        fromService:
          type: pserv
          name: himate-connector
          property: hostport
      - key: HEALTH_HOSTPORT
        fromService:
          type: pserv
          name: himate-health
          property: hostport
      - key: IMPACT_HOSTPORT
        fromService:
          type: pserv
          name: himate-impact
          property: hostport
      - key: EVIDENCE_HOSTPORT
        fromService:
          type: pserv
          name: himate-evidence
          property: hostport
      - key: REPORTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-reports
          property: hostport
      - key: CMS_HOSTPORT
        fromService:
          type: pserv
          name: himate-cms
          property: hostport
      - key: STORAGE_HOSTPORT
        fromService:
          type: pserv
          name: himate-storage
          property: hostport
      - key: PARTNER_RUNTIME_HOSTPORT
        fromService:
          type: pserv
          name: himate-runtime
          property: hostport
      - key: BACKUPS_HOSTPORT
        fromService:
          type: pserv
          name: himate-backups
          property: hostport
      - key: NOTIFICATIONS_HOSTPORT
        fromService:
          type: pserv
          name: himate-notifications
          property: hostport

  - type: cron
    name: himate-30day-invoice-cycle
    runtime: docker
    schedule: "0 6 * * *"
    dockerfilePath: ./services/docker/billing.Dockerfile
    dockerContext: .
    dockerCommand: /app/service --run-invoice-cycle
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: HIMATE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: himate-catalog
          envVarKey: HIMATE_INTERNAL_TOKEN
      - key: CATALOG_HOSTPORT
        fromService:
          type: pserv
          name: himate-catalog
          property: hostport
      - key: PAYMENTS_HOSTPORT
        fromService:
          type: pserv
          name: himate-payments
          property: hostport
